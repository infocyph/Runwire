name: C3 PHPForge Style Repair

on:
  push:
    branches:
      - plan/runwire-independent-ecosystem-roadmaps
    paths:
      - .github/workflows/c3-qa-style-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'infocyph/Runwire' && github.ref == 'refs/heads/plan/runwire-independent-ecosystem-roadmaps'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current Runwire plan branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Enable PHPForge formatter runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcntl, posix, sockets, event
          tools: composer:v2
          coverage: none
      - name: Secure dependency installation
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Apply the unmodified PHPForge Pint config to Runwire source
        run: vendor/bin/pint --config vendor/infocyph/phpforge/resources/pint.json src
      - name: Verify formatter convergence
        run: vendor/bin/pint --test --config vendor/infocyph/phpforge/resources/pint.json src
      - name: Commit formatted source after full PHPForge pre-commit verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/
          if git diff --cached --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git commit -m 'style(c3): enforce updated PHPForge Pint source rules'
          git push origin 'HEAD:refs/heads/plan/runwire-independent-ecosystem-roadmaps'
