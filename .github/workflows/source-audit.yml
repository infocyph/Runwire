name: Source Audit

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - src/**
      - tools/public-api-manifest.php
      - tools/public-api-diff.php
      - tools/public-api-migration-audit.php
      - qa/release-baseline/**
      - tests/**
      - composer.json
      - composer.lock
      - tools/pre-release-feature-qa.sh
      - docs/features.rst
      - docs/handbook-3.0.rst
      - docs/performance-security-3.0.rst
      - docs/index.rst
      - docs/host-compatibility-3.0.rst
      - docs/migration-3.0.rst
      - docs/compatibility-audit-3.0.rst
      - docs/performance-qa-handbook-3.0.rst
      - docs/protocols-3.0.rst
      - README.md
      - .github/workflows/source-audit.yml
  pull_request:
    paths:
      - src/**
      - tools/public-api-manifest.php
      - tools/public-api-diff.php
      - tools/public-api-migration-audit.php
      - qa/release-baseline/**
      - tests/**
      - composer.json
      - composer.lock
      - tools/pre-release-feature-qa.sh
      - docs/features.rst
      - docs/handbook-3.0.rst
      - docs/performance-security-3.0.rst
      - docs/index.rst
      - docs/host-compatibility-3.0.rst
      - docs/migration-3.0.rst
      - docs/compatibility-audit-3.0.rst
      - docs/performance-qa-handbook-3.0.rst
      - docs/protocols-3.0.rst
      - README.md
      - .github/workflows/source-audit.yml

permissions:
  contents: read

concurrency:
  group: sa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Runwire
        uses: actions/checkout@v7 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # v2
        with:
          php-version: '8.6'
          coverage: none

      - name: Checkout published 3.1 comparator
        uses: actions/checkout@v7
        with:
          ref: refs/tags/3.1
          path: published-3.1
          persist-credentials: false

      - name: Validate enumerated 3.1 to 4.0 public API changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p api-baseline
          baseline="$(git -C published-3.1 rev-parse HEAD)"
          test "$baseline" = "$(jq -er '.baselineRevision' qa/release-baseline/runwire-4-api-removals.json)"
          php tools/public-api-manifest.php published-3.1/src "$baseline" --with-properties > api-baseline/published-3.1.json
          php tools/public-api-manifest.php src "${GITHUB_SHA}" --with-properties > api-baseline/current.json
          jq -cn --slurpfile baseline api-baseline/published-3.1.json --slurpfile candidate api-baseline/current.json '{baseline: $baseline[0], candidate: $candidate[0]}' | php tools/public-api-diff.php > api-baseline/migration-source-diff.json
          jq --slurpfile policy qa/release-baseline/runwire-4-api-removals.json '
            {unexpectedRemoved: ([.breaking[] | select(.type == "removed_type") | .symbol] - $policy[0].removedTypes),
            missingRemoved: ($policy[0].removedTypes - [.breaking[] | select(.type == "removed_type") | .symbol]),
            unexpectedChanged: ([.changed[] | select(.type == "source_changed") | .symbol] - $policy[0].changedTypes),
            missingChanged: ($policy[0].changedTypes - [.changed[] | select(.type == "source_changed") | .symbol]),
            unexpectedDeclarations: [.breaking[], .changed[] | select(.type != "removed_type" and .type != "source_changed") | . as $actual | select(any($policy[0].declarations[]; .type == $actual.type and .symbol == $actual.symbol and (has("before") | not or .before == $actual.before)) | not)]}
          ' api-baseline/migration-source-diff.json
          jq -e --slurpfile policy qa/release-baseline/runwire-4-api-removals.json '
            .baselineRevision == $policy[0].baselineRevision and .propertyInventoryCompared
            and ([.breaking[] | select(.type == "removed_type") | .symbol] | sort) == $policy[0].removedTypes
            and ([.changed[] | select(.type == "source_changed") | .symbol] | sort) == $policy[0].changedTypes
            and .additionCount == 0
            and ([.breaking[], .changed[] | select(.type != "removed_type" and .type != "source_changed")] | all(. as $actual | any($policy[0].declarations[]; .type == $actual.type and .symbol == $actual.symbol and (has("before") | not or .before == $actual.before))))
          ' api-baseline/migration-source-diff.json
          sha256sum api-baseline/*.json | tee api-baseline/sha256sums.txt
          echo "Reviewed 4.0 source declarations; behavioral certification remains separate." >> "$GITHUB_STEP_SUMMARY"

      - name: Reject removed protocol references in production
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'Http3|HTTP_3|HTTP3_|Quic[A-Z_]|\bQUIC\b|Qpack|ext-quic' -- src runtime; then
            echo "::error::Retired transport reference in production"
            exit 1
          fi
          jq -e '((.require // {}) | has("ext-quic") | not) and ((.suggest // {}) | has("ext-quic") | not)' composer.json

      - name: Preserve reproducible API baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-public-api-manifests
          path: api-baseline/
          retention-days: 90

      - name: Syntax check source
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find src -type f -name '*.php' -print0 | sort -z)
          printf 'syntax-ok files=%s\n' "$(find src -type f -name '*.php' | wc -l)"

      - name: Check public 4.0 feature contracts and unsupported claims
        shell: bash
        run: bash tools/pre-release-feature-qa.sh

      - name: Risk-pattern scan
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '=== RISK PATTERN SCAN ==='
          grep -RInE --include='*.php' \
            '(TODO|FIXME|HACK|XXX|\beval\s*\(|\bexec\s*\(|\bshell_exec\s*\(|\bpassthru\s*\(|\bsystem\s*\(|\bproc_open\s*\(|\bunserialize\s*\(|\bserialize\s*\(|\bsleep\s*\(|\busleep\s*\(|\bexit\s*\(|\bdie\s*\()' \
            src || true
