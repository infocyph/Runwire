name: Normalize Consolidated Runwire Plan

on:
  push:
    branches:
      - runwire-1.0/foundation-3-launch

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runwire-1.0/foundation-3-launch
      - name: Normalize canonical plan
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/plans/runwire-1.0-foundation-3-launch-plan.md')
          text = path.read_text()
          marker = '# Runtime drivers, host engines & OPcache'

          if marker in text:
              before, tail = text.split(marker, 1)
              tail = tail.strip()
              tail = re.sub(r'(?m)^##\s+(\d+)\.\s+', lambda m: f'## 41.{m.group(1)} ', tail)
              tail = tail.replace(
                  'This section is part of the Runwire 1.0 launch gate and must be reconciled into the consolidated canonical plan before release.',
                  'This section is part of the canonical Runwire 1.0 launch gate.'
              )

              before = before.rstrip()
              before = before.replace('# 41. 1.0 completion gate', '# 42. 1.0 completion gate')
              before = before.replace('# 42. Immediate implementation handoff', '# 43. Immediate implementation handoff')
              insertion = '# 41. Runtime drivers, host engines & OPcache\n\n' + tail + '\n\n---\n\n'
              gate = '# 42. 1.0 completion gate'
              if gate in before:
                  before = before.replace(gate, insertion + gate, 1)
              else:
                  before = before + '\n\n---\n\n' + insertion
              text = before.rstrip() + '\n'

          path.write_text(text)
          Path('.github/workflows/normalize-consolidated-plan.yml').unlink()
          PY
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: normalize consolidated Runwire plan"
          git push origin HEAD:runwire-1.0/foundation-3-launch
