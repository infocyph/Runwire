name: C4 immutable migration behavior

on:
  pull_request:
    branches: [ "main", "master", "develop", "development" ]
    paths:
      - benchmarks/c4_migration_wire_acceptance.sh
      - .github/workflows/c4-migration-behavior.yml
      - src/**
      - composer.json
      - docs/migration-3.0.rst
      - docs/compatibility-audit-3.0.rst
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c4-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-old-new-compatibility:
    name: Live 2.1.2-vs-3.0 HTTP migration - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout published immutable 2.1.2 comparator
        uses: actions/checkout@v7
        with:
          ref: 7e9bf20ad0737a187dfed77b723791b141b36378
          path: baseline
      - name: Checkout exact PR candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Setup PHP with native runtime requirements
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pcntl, posix, event, opcache
          coverage: none
      - name: Install independent locked real source worktrees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = 7e9bf20ad0737a187dfed77b723791b141b36378
          git -C candidate rev-parse HEAD
          composer install --working-dir=baseline --no-dev --no-interaction --prefer-dist --no-progress --no-scripts
          composer install --working-dir=candidate --no-dev --no-interaction --prefer-dist --no-progress --no-scripts
          composer check-platform-reqs --working-dir=baseline --no-dev
          composer check-platform-reqs --working-dir=candidate --no-dev
      - name: Exercise identical real HTTP success/rejection contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c4-migration-evidence
          bash candidate/benchmarks/c4_migration_wire_acceptance.sh \
            baseline candidate c4-migration-evidence
      - name: Retain immutable before-after behavior and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-c4-migration-php-${{ matrix.php }}
          path: c4-migration-evidence/
          retention-days: 90
