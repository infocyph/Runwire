name: "HTTP Improvement V1"

on:
  push:
    branches: [ "feat/http-improvement" ]
    paths:
      - ".github/workflows/http-improvement-v1.yml"
      - "benchmarks/http12_lab_server.php"
      - "benchmarks/http1_v1_certification.sh"
      - "benchmarks/patch_h1_coalesce.php"
      - "benchmarks/http1_sustained_bench.php"
      - "benchmarks/sustained_summary.php"
      - "src/Http/Http1/**"
      - "src/Http/NativeHttpConnection.php"
      - "src/Network/**"
      - "docs/plans/runwire-protocol-performance-implementation-plan.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runwire-http-improvement-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-http1:
    name: "H1 V1 ${{ matrix.transport }} / ${{ matrix.payload }} B"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        transport: [ plain, tls ]
        payload: [ 2, 1024, 16384, 65536 ]

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: feat/http-improvement

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: pcntl, posix, event, opcache
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Build benchmark-only coalescing candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/runwire-h1-coalesce
          mkdir -p /tmp/runwire-h1-coalesce
          tar --exclude=.git -cf - . | tar -C /tmp/runwire-h1-coalesce -xf -
          php benchmarks/patch_h1_coalesce.php /tmp/runwire-h1-coalesce
          php -l /tmp/runwire-h1-coalesce/src/Http/Http1/Http1ResponseWriter.php

      - name: Generate TLS certificate
        shell: bash
        run: |
          mkdir -p .lab
          openssl req -x509 -newkey rsa:2048 -nodes             -keyout .lab/key.pem -out .lab/cert.pem -days 1 -subj '/CN=localhost' >/dev/null 2>&1

      - name: Run five-trial V1 certification
        shell: bash
        run: |
          bash benchmarks/http1_v1_certification.sh             "$PWD" /tmp/runwire-h1-coalesce             .lab/cert.pem .lab/key.pem             "validation-evidence/http1-${{ matrix.transport }}-${{ matrix.payload }}"             "${{ matrix.transport }}" "${{ matrix.payload }}" 5 1

      - name: Upload V1 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "runwire-v1-http1-${{ matrix.transport }}-${{ matrix.payload }}"
          path: "validation-evidence/http1-${{ matrix.transport }}-${{ matrix.payload }}/"
          retention-days: 30
