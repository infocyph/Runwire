name: "Runwire C1 Socket Syscall Attribution (instrumented)"

on:
  push:
    branches: [ "plan/runwire-independent-ecosystem-roadmaps" ]
    paths:
      - ".github/workflows/c1-socket-syscall-attribution.yml"
      - "benchmarks/u08_socket_syscall_parse.py"
      - "benchmarks/u08_socket_syscall_trace.sh"
      - "tests/test_u08_socket_syscall_parse.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c1-socket-calls-${{ github.sha }}
  cancel-in-progress: false

jobs:
  real-socket-syscalls:
    name: "C1 H1 plaintext/TLS socket syscalls - PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pcntl, posix, event, opcache, openssl
          tools: composer:v2
          coverage: none
      - name: Install immutable dependencies and scoped instrumentation
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
          strace -V
      - name: Validate independent socket-FD classifier fixtures
        run: |
          python3 -m unittest discover -s tests -p 'test_u08_socket_syscall_parse.py' -v
          bash -n benchmarks/u08_socket_syscall_trace.sh
      - name: Trace correct H1 payload/connection/concurrency variants on verified TLS and plaintext
        timeout-minutes: 16
        shell: bash
        run: |
          set -euo pipefail
          for bytes in 2 65536; do
            for mode in keep-alive close; do
              for concurrency in 1 16; do
                export RUNWIRE_BENCH_RESPONSE_BYTES="$bytes"
                export RUNWIRE_BENCH_CONNECTION_MODE="$mode"
                export RUNWIRE_TRACE_CONCURRENCY="$concurrency"
                out="build/c1-socket-syscalls/${bytes}-${mode}-${concurrency}"
                bash benchmarks/u08_socket_syscall_trace.sh "$out"
                jq -e --argjson size "$bytes" --arg reuse "$mode" \
                    --argjson concurrent "$concurrency" '
                  .correctness_passed == true and .tls == "off"
                  and .successful_requests == .requests_total and .successful_requests > 0
                  and .response_body_bytes == $size and .connection_reuse == $reuse
                  and .concurrency == $concurrent' "$out/plain-clients.json" >/dev/null
                jq -e --argjson size "$bytes" --arg reuse "$mode" \
                    --argjson concurrent "$concurrency" '
                  .correctness_passed == true and .tls == "on-verified"
                  and .successful_requests == .requests_total and .successful_requests > 0
                  and .response_body_bytes == $size and .connection_reuse == $reuse
                  and .concurrency == $concurrent' "$out/tls-clients.json" >/dev/null
                for population in plain tls; do
                  jq -e '.socket_fd_read_family_successful_syscalls > 0
                    and .socket_fd_write_family_successful_syscalls > 0
                    and .trace_performance_overhead == true
                    and .untraced_benchmark_equivalence_claimed == false' \
                    "$out/$population-syscalls.json" >/dev/null
                done
              done
            done
          done
          test "$(find build/c1-socket-syscalls -name 'tls-syscalls.json' | wc -l)" -eq 8
      - name: Archive traced server sockets and explicit perturbation caveats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c1-socket-syscall-php-${{ matrix.php-version }}-${{ github.sha }}
          path: build/c1-socket-syscalls/
          retention-days: 90
          if-no-files-found: warn
