name: "HTTP/2 Independent Reference"

on:
  pull_request:
    branches: [ "main", "master", "develop", "development" ]
  workflow_dispatch:

# An independent hyper-h2 interoperability test, not a duplicate PHPForge lane.
concurrency:
  group: h2-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hyper-h2:
    name: "hyper-h2 TLS reference - PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.4", "8.5", "8.6" ]
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v7 # v7.0.1

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: openssl, pcntl, posix, sockets
          coverage: none

      - name: Install pinned independent hyper-h2 fixture
        shell: bash
        run: |
          python3 -m venv .ci/h2-reference-venv
          .ci/h2-reference-venv/bin/python -m pip install --disable-pip-version-check 'h2==4.2.0'
          echo "$PWD/.ci/h2-reference-venv/bin" >> "$GITHUB_PATH"

      - name: Install Runwire dev test dependencies (no native event backend)
        # H2 uses the portable SelectLoop, not ext-event; do not make the
        # optional native reactor a dependency of independent interop tests.
        run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-event

      - name: Verify real TLS, ALPN, and independent H2 headers/body
        env:
          RUNWIRE_REQUIRE_H2_REFERENCE: "1"
        run: |
          python3 -c 'import h2.connection; print("Independent hyper-h2 available")'
          cp vendor/infocyph/phpforge/resources/pest.xml pest.xml
          vendor/bin/pest --configuration=pest.xml qa/reference/Http2IndependentReferenceTest.php qa/reference/Http2MultiplexIndependentReferenceTest.php

      - name: Verify matched outbound H1/H2 TLS profile
        shell: bash
        run: |
          bash -n tests/interop/independent_outbound_h12.sh
          RUNWIRE_RUNTIME_BUILD="$(git rev-parse HEAD)" bash tests/interop/independent_outbound_h12.sh benchmark-results/u07-outbound-match.json

      - name: Upload outbound H1/H2 profile
        uses: actions/upload-artifact@v7
        with:
          name: outbound-h12-profile-php-${{ matrix.php }}
          path: benchmark-results/u07-outbound-match.json
          retention-days: 90

      - name: Verify strict GOAWAY filtering and post-GOAWAY accepted DATA
        run: python3 benchmarks/test_mixed_native_goaway.py

      - name: Real simultaneous H1/H2/TCP/UDP native crash and rolling recycle
        shell: bash
        run: |
          mkdir -p benchmark-results
          python3 benchmarks/mixed_native_lifecycle.py | tee benchmark-results/mixed-native-lifecycle.json
          jq -e '.correctness_passed == true and .events.reload_completed > 0
            and .events.manual_recycle_requested > 0 and .simultaneous_h2_streams_per_wave == 8
            and .cancelled_h2_streams_per_wave == 1 and .slow_receiver_delay_ms == 20
            and ([.waves[] | select(.http1 != 1 or .http2 != 8 or .tcp != 1 or .udp != 1
                or .cancelled_h2_streams != 1)] | length) == 0' benchmark-results/mixed-native-lifecycle.json >/dev/null

      - name: Upload mixed native listener lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-mixed-native-lifecycle-php-${{ matrix.php }}
          path: benchmark-results/mixed-native-lifecycle.json
          retention-days: 90
