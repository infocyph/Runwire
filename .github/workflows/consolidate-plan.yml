name: Consolidate Runwire Plan

on:
  push:
    branches:
      - runwire-1.0/foundation-3-launch

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runwire-1.0/foundation-3-launch
      - name: Consolidate plan files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('docs/plans/runwire-1.0-foundation-3-launch-plan.md')
          addendum = Path('docs/plans/runwire-1.0-runtime-drivers-opcache-addendum.md')
          text = main.read_text()
          extra = addendum.read_text()

          parts = extra.split('\n---\n', 1)
          body = parts[1].strip() if len(parts) == 2 else extra.strip()
          merged = text.rstrip() + '\n\n---\n\n# Runtime drivers, host engines & OPcache\n\n' + body + '\n'
          merged = merged.replace('normative addendum', 'integrated runtime-driver section')
          merged = merged.replace('This addendum', 'This section').replace('the addendum', 'this section')
          main.write_text(merged)

          addendum.unlink()
          Path('.github/workflows/consolidate-plan.yml').unlink()
          PY
      - name: Commit consolidation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: consolidate Runwire 1.0 plan"
          git push origin HEAD:runwire-1.0/foundation-3-launch
