name: C4 matched real ALPN HTTP2 five-paired 180s
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches: [main, master, develop, development]
permissions:
  contents: read
concurrency:
  group: c4-matched-h2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  real-h2-matched:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'c4-matched-h2'
    name: Independent real H2 published vs candidate 5x180 - PHP 8.5
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7e9bf20ad0737a187dfed77b723791b141b36378
          path: baseline
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pcntl, posix, sockets, event, opcache, openssl
          tools: composer:v2
          coverage: none
      - name: Select fast independent Python HTTP/2 benchmark runtime
        uses: actions/setup-python@v6
        with:
          python-version: 'pypy3.11'
      - name: Install source trees and independent hyper-h2 peer
        run: |
          set -euo pipefail
          composer install --working-dir=baseline --no-dev --no-interaction --prefer-dist --no-progress --no-scripts
          composer install --working-dir=candidate --no-dev --no-interaction --prefer-dist --no-progress --no-scripts
          python -m pip install 'h2>=4.2,<5'
          python -c 'import platform, h2; assert platform.python_implementation() == "PyPy"; print("Independent H2 peer:", platform.python_implementation(), h2.__version__)'
      - name: Verify exact 2.1.2 to 3.0 independent five-pair protocol/response correctness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          PYTHON_BIN=python bash candidate/benchmarks/c4_matched_h2_180.sh baseline candidate c4-h2-evidence
      - name: Preserve exact 10x180s H2 metrics and strict comparator
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-c4-h2-five-pair-php85
          path: c4-h2-evidence/
          retention-days: 90
