name: "Benchmarks"

on:
  workflow_dispatch:
    inputs:
      certification:
        description: "Run release-duration sustained trials and soak"
        required: false
        default: false
        type: boolean
      tls_certification:
        description: "Run full matched 2.1.2-versus-3.0 verified TLS certification"
        required: false
        default: false
        type: boolean
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

concurrency:
  group: bm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matched-tls:
    name: "U04 matched verified TLS - PHP 8.4"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tls_certification }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout immutable Runwire 2.1.2 baseline
        uses: actions/checkout@v7
        with:
          ref: "2.1.2"
          path: baseline
      - name: Checkout Runwire 3.0 candidate
        uses: actions/checkout@v7
        with:
          path: candidate
      - name: Setup pinned PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: pcntl, posix, event, opcache, openssl
          coverage: none
      - name: Install independently locked dependencies
        shell: bash
        run: |
          (cd baseline && composer install --no-interaction --prefer-dist --no-progress)
          (cd candidate && composer install --no-interaction --prefer-dist --no-progress)
      - name: Run 5 matched 180s TLS populations on pinned physical cores
        shell: bash
        run: |
          mkdir -p candidate/benchmark-results/u04-matched-tls
          RUNWIRE_BENCH_TLS=1 \
            RUNWIRE_BASELINE_BUILD="$(cd baseline && git rev-parse HEAD)" \
            RUNWIRE_CANDIDATE_BUILD="$(cd candidate && git rev-parse HEAD)" \
            bash candidate/benchmarks/matched_release_certification.sh \
            baseline candidate candidate/benchmark-results/u04-matched-tls
          jq -e '.budget_enforced == true and .passed == true' \
            candidate/benchmark-results/u04-matched-tls/comparison.json >/dev/null
      - name: Upload matched TLS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-u04-matched-tls-php-8.4
          path: candidate/benchmark-results/u04-matched-tls/
          retention-days: 61
  protocol-core:
    name: "Protocol + host core - PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    permissions:
      contents: read

    steps:
      - name: Checkout Runwire
        uses: actions/checkout@v7 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: pcntl, posix, event, opcache
          coverage: none

      - name: Install Runwire dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Test sustained benchmark accounting
        shell: bash
        run: |
          cp vendor/infocyph/phpforge/resources/pest.xml .phpforge-pest-benchmark.xml
          trap 'rm -f .phpforge-pest-benchmark.xml' EXIT
          vendor/bin/pest --configuration=.phpforge-pest-benchmark.xml tests/Http1SustainedBenchTest.php

      - name: Record environment
        shell: bash
        run: |
          mkdir -p benchmark-results
          {
            php -v
            composer --version
            printf 'DEPENDENCY LOCK SHA256: '
            sha256sum composer.lock
            printf 'Cgroup CPU limit: '
            cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
            printf 'Cgroup memory limit: '
            cat /sys/fs/cgroup/memory.max 2>/dev/null || true
            printf 'FD soft/hard limits: '
            ulimit -Sn
            ulimit -Hn
            php --ini=diff || true
            php --ri event || true
            php --ri 'Zend OPcache' || true
            uname -a
            lscpu
          } > "benchmark-results/environment-php-${{ matrix.php-version }}.txt"

      - name: Record exact locked development dependencies
        shell: bash
        run: |
          composer show --locked --format=json > "benchmark-results/dependencies-php-${{ matrix.php-version }}.json"
          jq -e '(.locked // []) | length > 0' "benchmark-results/dependencies-php-${{ matrix.php-version }}.json" >/dev/null

      - name: Audit exact locked dependencies for published security advisories
        shell: bash
        run: |
          composer audit --locked --abandoned=report --no-interaction --format=json \
            > "benchmark-results/composer-security-audit-php-${{ matrix.php-version }}.json"
          jq -e '(.advisories | length) == 0' \
            "benchmark-results/composer-security-audit-php-${{ matrix.php-version }}.json" >/dev/null

      - name: Snapshot public and protected PHP contracts
        shell: bash
        run: |
          php benchmarks/public_api_snapshot.php > "benchmark-results/public-api-php-${{ matrix.php-version }}.json"
          jq -e '.schema == 1 and .type_count > 0 and (.types | length) == .type_count' "benchmark-results/public-api-php-${{ matrix.php-version }}.json" >/dev/null

      - name: Profile hosted request path phases without production instrumentation
        shell: bash
        run: |
          RUNWIRE_RUNTIME_BUILD="${{ github.event.pull_request.head.sha || github.sha }}" \
            php benchmarks/r0_host_profile.php 5000 1000 \
            > "benchmark-results/r0-host-profile-php-${{ matrix.php-version }}.json"
          jq -e '.schema == 1 and .correctness_passed == true
            and .completed == 5000
            and .host_network_included == false
            and .phases.total.p99_us > 0
            and .phases.dispatch_and_finalization.p99_us > 0' \
            "benchmark-results/r0-host-profile-php-${{ matrix.php-version }}.json" >/dev/null

      - name: Profile R2 scheduler pressure under bounded tasks and I/O waits
        shell: bash
        run: |
          RUNWIRE_RUNTIME_BUILD="${{ github.event.pull_request.head.sha || github.sha }}" \
            php benchmarks/r2_scheduler_pressure.php 6 2 \
            > "benchmark-results/r2-scheduler-php-${{ matrix.php-version }}.json"
          jq -e '.correctness_passed == true and .schema == 1
            and .real_network_included == false
            and .overload_boundary.overflow_rejected == true
            and .overload_boundary.active_after == 0
            and (.modes | length) == 15
            and ([.modes[] | select(.active_after != 0 or .watchers_after != 0 or .timers_after != 0)] | length) == 0' \
            "benchmark-results/r2-scheduler-php-${{ matrix.php-version }}.json" >/dev/null

      - name: Profile U01 genuine off-loop executor cost and fairness
        shell: bash
        run: |
          RUNWIRE_RUNTIME_BUILD="${{ github.event.pull_request.head.sha || github.sha }}" \
            php benchmarks/u01_executor_profile.php \
            > "benchmark-results/u01-executor-profile-php-${{ matrix.php-version }}.json"
          jq -e '.schema == 1 and .correctness_passed == true
            and .jobs_completed == .jobs_submitted
            and .jobs_failed == 0 and .pending_after == 0
            and .worker_count_after == 0
            and .loop_ticks > 0
            and .latency.p99_ms > 0 and .cpu.parent_user_ms >= 0
            and .memory.parent_peak_allocated_bytes > 0' \
            "benchmark-results/u01-executor-profile-php-${{ matrix.php-version }}.json" >/dev/null

      - name: Profile U03 sequential versus overlapping real outbound connects
        shell: bash
        run: |
          RUNWIRE_RUNTIME_BUILD="${{ github.event.pull_request.head.sha || github.sha }}" \
            php benchmarks/u03_dial_profile.php \
            > "benchmark-results/u03-outbound-php-${{ matrix.php-version }}.json"
          jq -e '.schema == 1 and .correctness_passed == true
            and .real_socket_io == true
            and .sequential.submitted == 24 and .sequential.completed == 24
            and .overlap.submitted == 24 and .overlap.completed == 24
            and .sequential.failed == 0 and .overlap.failed == 0
            and .sequential.accepted == 24 and .overlap.accepted == 24
            and .sequential.p99_ms >= 0 and .overlap.p99_ms >= 0
            and .sequential.cpu_parent_ms >= 0 and .overlap.cpu_parent_ms >= 0
            and .sequential.rss_bytes > 0 and .overlap.rss_bytes > 0
            and .sequential.watchers_after == 0 and .overlap.watchers_after == 0' \
            "benchmark-results/u03-outbound-php-${{ matrix.php-version }}.json" >/dev/null

      - name: Soak mixed real socket, CPU and timer pressure across three levels
        shell: bash
        run: |
          RUNWIRE_RUNTIME_BUILD="${{ github.event.pull_request.head.sha || github.sha }}" \
            php benchmarks/r2_mixed_scheduler_soak.php 3.0 \
            > "benchmark-results/r2-mixed-soak-php-${{ matrix.php-version }}.json"
          jq -e '.schema == 1 and .correctness_passed == true
            and .real_socket_io == true and .tier_count == 3
            and ([.tiers[] | select(.correctness_passed != true or .readable_p99_ms > 500
              or .pending_socket_bytes > 1 or .watchers_after != 0
              or .timers_after != 0 or .deferred_after != 0)] | length) == 0' \
            "benchmark-results/r2-mixed-soak-php-${{ matrix.php-version }}.json" >/dev/null

      - name: Capture Runwire OPcache footprint
        shell: bash
        run: |
          for mode in bootstrap lifecycle coroutine; do
            result="benchmark-results/opcache-${mode}-php-${{ matrix.php-version }}.json"
            php -d opcache.enable_cli=1 benchmarks/opcache_footprint.php "$mode" > "$result"
            jq -e '
              .correctness_passed == true
              and .source_php_files > 0
              and .opcache_enabled == true
              and .opcache.cache_full == false
              and (
                .mode == "bootstrap"
                or (
                  .included_runwire_files > 0
                  and .cached_runwire_files > 0
                  and .cached_runwire_files == .included_runwire_files
                  and ((.included_runwire_scripts - .cached_runwire_scripts) | length == 0)
                )
              )
            ' "$result" >/dev/null
            cat "$result"
          done

      - name: Run PHPBench suite
        shell: bash
        run: |
          result="benchmark-results/phpbench-php-${{ matrix.php-version }}.json"
          vendor/bin/phpbench run \
            --report=aggregate \
            --output=json \
            --progress=none \
            --bootstrap=vendor/autoload.php \
            --config=vendor/infocyph/phpforge/resources/phpbench.json \
            benchmarks > "$result"
          jq -e 'type == "array" and length > 0' "$result" >/dev/null
          cat "$result"

      - name: Checkout immutable published 2.1.2 HPACK comparator
        uses: actions/checkout@v7
        with:
          ref: 7e9bf20ad0737a187dfed77b723791b141b36378
          path: baseline-hpack
          persist-credentials: false

      - name: Record comparable HPACK 2.1.2 versus development microprofiles
        shell: bash
        run: |
          set -euo pipefail
          php -l benchmarks/u08_hpack_source_profile.php
          directory="benchmark-results/u08-hpack-php-${{ matrix.php-version }}"
          mkdir -p "$directory"
          baseline_sha="7e9bf20ad0737a187dfed77b723791b141b36378"
          candidate_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          php benchmarks/u08_hpack_source_profile.php baseline-hpack/src "$baseline_sha" 320 > "$directory/baseline.json"
          php benchmarks/u08_hpack_source_profile.php src "$candidate_sha" 320 > "$directory/candidate.json"
          jq -e --arg base "$baseline_sha" --arg current "$candidate_sha" \
            '.schemaVersion == 1 and .sourceRevision == $base and .releaseCertified == false
             and (.workloads | length) == 4 and all(.workloads[]; .trials == 5 and .iterations == 320 and .median_nanoseconds_per_op > 0)' \
            "$directory/baseline.json" >/dev/null
          jq -e --arg current "$candidate_sha" \
            '.schemaVersion == 1 and .sourceRevision == $current and .releaseCertified == false
             and (.workloads | length) == 4 and all(.workloads[]; .trials == 5 and .iterations == 320 and .median_nanoseconds_per_op > 0)' \
            "$directory/candidate.json" >/dev/null
          jq -n --slurpfile original "$directory/baseline.json" --slurpfile latest "$directory/candidate.json" '
            ($original[0]) as $before | ($latest[0]) as $after |
            {
              schemaVersion: 1,
              baselineRevision: $before.sourceRevision,
              candidateRevision: $after.sourceRevision,
              scope: "matched-source-microprofile-not-release-certification",
              releaseCertified: false,
              samplesPerWorkload: 5,
              workloads: ($after.workloads | to_entries | map({
                key: .key,
                value: {
                  baseline_median_nanoseconds_per_op: $before.workloads[.key].median_nanoseconds_per_op,
                  candidate_median_nanoseconds_per_op: .value.median_nanoseconds_per_op,
                  baseline_cv_percent: $before.workloads[.key].cv_percent,
                  candidate_cv_percent: .value.cv_percent,
                  candidate_to_baseline_ratio: (.value.median_nanoseconds_per_op / $before.workloads[.key].median_nanoseconds_per_op)
                }
              }) | from_entries)
            }' > "$directory/comparison.json"
          jq -e '.schemaVersion == 1 and .releaseCertified == false and (.workloads | length) == 4
            and all(.workloads[]; .candidate_to_baseline_ratio > 0)' "$directory/comparison.json" >/dev/null

      - name: Compare F-04 helper with manual bounded pump
        shell: bash
        run: |
          php benchmarks/transfer_compare.php \
            | tee "benchmark-results/f04-transfer-php-${{ matrix.php-version }}.json"
          jq -e '.correctness_passed == true and .passed == true' \
            "benchmark-results/f04-transfer-php-${{ matrix.php-version }}.json" >/dev/null

      - name: Validate comparative-evidence tooling
        shell: bash
        run: |
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT

          cat > "$fixture_dir/fixture-a.json" <<'JSON'
          {
            "runtime": "validator-fixture-a",
            "runtime_version": "test-only",
            "runtime_build": "fixture-build",
            "protocol": "http/1.1",
            "workload": "validator-only",
            "hardware_id": "validator-fixture",
            "host_os": "fixture-os",
            "host_cpu": "fixture-cpu",
            "php_version": "${{ matrix.php-version }}",
            "instrumentation": "test-only",
            "tls": "off",
            "opcache": "off",
            "connection_reuse": "keep-alive",
            "extension_versions": {"fixture": "1"},
            "workers": 1,
            "concurrency": 1,
            "duration_seconds": 1,
            "requests_total": 1,
            "completed_requests": 1,
            "successful_requests": 1,
            "throughput_rps": 1.0,
            "latency_ms": {"p50": 1.0, "p95": 2.0, "p99": 3.0},
            "errors_total": 0,
            "timeouts_total": 0,
            "validation_failures": 0,
            "error_rate": 0.0,
            "cpu_percent": 1.0,
            "rss_peak_bytes": 1,
            "correctness_passed": true
          }
          JSON
          cat > "$fixture_dir/fixture-b.json" <<'JSON'
          {
            "runtime": "validator-fixture-b",
            "runtime_version": "test-only",
            "runtime_build": "fixture-build",
            "protocol": "http/1.1",
            "workload": "validator-only",
            "hardware_id": "validator-fixture",
            "host_os": "fixture-os",
            "host_cpu": "fixture-cpu",
            "php_version": "${{ matrix.php-version }}",
            "instrumentation": "test-only",
            "tls": "off",
            "opcache": "off",
            "connection_reuse": "keep-alive",
            "extension_versions": {"fixture": "1"},
            "workers": 1,
            "concurrency": 1,
            "duration_seconds": 1,
            "requests_total": 1,
            "completed_requests": 1,
            "successful_requests": 1,
            "throughput_rps": 2.0,
            "latency_ms": {"p50": 1.0, "p95": 2.0, "p99": 3.0},
            "errors_total": 0,
            "timeouts_total": 0,
            "validation_failures": 0,
            "error_rate": 0.0,
            "cpu_percent": 2.0,
            "rss_peak_bytes": 2,
            "correctness_passed": true
          }
          JSON
          jq '.concurrency = 2' "$fixture_dir/fixture-b.json" > "$fixture_dir/mismatch.json"

          php benchmarks/comparative_evidence.php \
            "$fixture_dir/fixture-a.json" \
            "$fixture_dir/fixture-b.json" \
            > /dev/null

          if php benchmarks/comparative_evidence.php \
            "$fixture_dir/fixture-a.json" \
            "$fixture_dir/mismatch.json" \
            > /dev/null 2>&1; then
            echo "comparative evidence mismatch unexpectedly passed" >&2
            exit 1
          fi

      - name: Run repeated real native HTTP/1 evidence
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.certification }}" = "true" ]; then
            warmup_seconds=30
            duration_seconds=180
            instrumentation="release-certification"
          else
            warmup_seconds=1
            duration_seconds=3
            instrumentation="ci-smoke"
          fi

          tmpdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM "$server_pid" 2>/dev/null || true
              for attempt in $(seq 1 100); do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.02
              done
              if kill -0 "$server_pid" 2>/dev/null; then
                kill -KILL "$server_pid" 2>/dev/null || true
              fi
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          port="$(php -r '
          $server = stream_socket_server("tcp://127.0.0.1:0", $errno, $error);
          if (!is_resource($server)) {
              throw new RuntimeException($error);
          }
          $name = stream_socket_get_name($server, false);
          fclose($server);
          if (!is_string($name) || !str_contains($name, ":")) {
              throw new RuntimeException("Unable to resolve ephemeral benchmark port.");
          }
          echo substr(strrchr($name, ":"), 1);
          ')"

          php -d opcache.enable_cli=1 benchmarks/http1_server.php "$port" \
            >"$tmpdir/server.log" 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 200); do
            if php -r '
          $socket = @stream_socket_client("tcp://127.0.0.1:" . $argv[1], $errno, $error, 0.05);
          if (!is_resource($socket)) {
              throw new RuntimeException($error);
          }
          fclose($socket);
          ' "$port" >/dev/null 2>&1
            then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$tmpdir/server.log"
              exit 1
            fi
            sleep 0.02
          done

          if ! kill -0 "$server_pid" 2>/dev/null; then
            cat "$tmpdir/server.log"
            exit 1
          fi

          export RUNWIRE_RUNTIME_VERSION="2.2-development"
          export RUNWIRE_RUNTIME_BUILD="$GITHUB_SHA"
          export RUNWIRE_PHP_VERSION="$(php -r 'echo PHP_VERSION;')"
          export RUNWIRE_INSTRUMENTATION="$instrumentation"
          export RUNWIRE_OPCACHE="$(php -d opcache.enable_cli=1 -r 'echo function_exists("opcache_get_status") && opcache_get_status(false) !== false ? "enabled-cli" : "disabled";')"
          export RUNWIRE_EXTENSION_VERSIONS="$(php -r '
          $extensions = ["pcntl", "posix", "event", "Zend OPcache"];
          $values = [];
          foreach ($extensions as $extension) {
              if (!extension_loaded($extension)) {
                  continue;
              }
              $version = phpversion($extension);
              $values[] = $extension . "=" . (is_string($version) && $version !== "" ? $version : "builtin");
          }
          echo implode(",", $values);
          ')"

          files=()
          for trial in 1 2 3 4 5; do
            result="benchmark-results/http1-php-${{ matrix.php-version }}-trial-$trial.json"
            php benchmarks/http1_sustained_bench.php \
              "$port" 16 "$warmup_seconds" "$duration_seconds" "$server_pid" \
              > "$result"
            jq -e '.correctness_passed == true and .successful_requests == .requests_total and .errors_total == 0 and .timeouts_total == 0 and .validation_failures == 0' "$result" >/dev/null
            files+=("$result")
          done

          php benchmarks/sustained_summary.php "${files[@]}" \
            > "benchmark-results/http1-php-${{ matrix.php-version }}-summary.json"
          cat "benchmark-results/http1-php-${{ matrix.php-version }}-summary.json"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.certification }}" = "true" ]; then
            soak="benchmark-results/http1-php-${{ matrix.php-version }}-30m-soak.json"
            php benchmarks/http1_sustained_bench.php \
              "$port" 32 0 1800 "$server_pid" \
              > "$soak"
            jq -e '.correctness_passed == true and .successful_requests == .requests_total and .errors_total == 0 and .timeouts_total == 0 and .validation_failures == 0' "$soak" >/dev/null
          fi

          kill -TERM "$server_pid"
          wait "$server_pid"
          server_pid=""

      - name: Run independent native WebSocket evidence
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.certification }}" = "true" ]; then
            duration_seconds=180
            soak_seconds=1800
          else
            duration_seconds=2
            soak_seconds=0
          fi

          tmpdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM "$server_pid" 2>/dev/null || true
              for attempt in $(seq 1 100); do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.02
              done
              if kill -0 "$server_pid" 2>/dev/null; then
                kill -KILL "$server_pid" 2>/dev/null || true
              fi
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          port="$(php -r '
          $server = stream_socket_server("tcp://127.0.0.1:0", $errno, $error);
          if (!is_resource($server)) {
              throw new RuntimeException($error);
          }
          $name = stream_socket_get_name($server, false);
          fclose($server);
          if (!is_string($name) || !str_contains($name, ":")) {
              throw new RuntimeException("Unable to resolve ephemeral WebSocket benchmark port.");
          }
          echo substr(strrchr($name, ":"), 1);
          ')"

          php -d opcache.enable_cli=1 benchmarks/websocket_server.php "$port" \
            >"$tmpdir/websocket-server.log" 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 200); do
            if php -r '
          $socket = @stream_socket_client("tcp://127.0.0.1:" . $argv[1], $errno, $error, 0.05);
          if (!is_resource($socket)) {
              throw new RuntimeException($error);
          }
          fclose($socket);
          ' "$port" >/dev/null 2>&1
            then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$tmpdir/websocket-server.log"
              exit 1
            fi
            sleep 0.02
          done

          result="benchmark-results/f05-websocket-php-${{ matrix.php-version }}.json"
          if ! php benchmarks/websocket_evidence.php \
            --port="$port" \
            --concurrency=8 \
            --trials=5 \
            --duration="$duration_seconds" \
            --soak-seconds="$soak_seconds" \
            | tee "$result"; then
            echo "::group::WebSocket server log"
            cat "$tmpdir/websocket-server.log"
            echo "::endgroup::"
            exit 1
          fi

          jq -e '
            .correctness_passed == true
            and .slow_reader_passed == true
            and .errors_total == 0
            and .timeouts_total == 0
            and .validation_failures == 0
          ' "$result" >/dev/null

          kill -TERM "$server_pid"
          wait "$server_pid"
          server_pid=""

      - name: Smoke-test verified TLS benchmark transport
        shell: bash
        run: bash benchmarks/u04_tls_smoke.sh "benchmark-results/u04-tls-php-${{ matrix.php-version }}.json"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-benchmarks-php-${{ matrix.php-version }}
          path: benchmark-results/
          retention-days: 61

  adaptive-http12:
    name: "Adaptive H1/H2 diagnostics - PHP 8.5"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout Runwire
        uses: actions/checkout@v7 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: pcntl, posix, event, opcache
          coverage: none

      - name: Install Runwire dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install H2 benchmark client
        shell: bash
        run: |
          python3 -m venv /tmp/runwire-h2
          /tmp/runwire-h2/bin/pip install --disable-pip-version-check --no-cache-dir 'h2==4.3.0'

      - name: Test adaptive matrix harness
        shell: bash
        run: |
          cp vendor/infocyph/phpforge/resources/pest.xml .phpforge-pest-adaptive.xml
          trap 'rm -f .phpforge-pest-adaptive.xml' EXIT
          vendor/bin/pest --configuration=.phpforge-pest-adaptive.xml             tests/AdaptiveBenchmarkEvidenceTest.php             tests/AdaptivePromotionMatrixTest.php
          /tmp/runwire-h2/bin/python -m unittest discover -s tests/benchmarks -p 'test_adaptive_h1_client.py' -v
          /tmp/runwire-h2/bin/python -m unittest discover -s tests/benchmarks -p 'test_adaptive_h2_client.py' -v

      - name: Real h2 cancellation, stalled-flow and sibling progress acceptance
        shell: bash
        run: |
          RUNWIRE_H2_PYTHON=/tmp/runwire-h2/bin/python bash benchmarks/h2_fault_acceptance.sh

      - name: Real independent H2 HPACK, flow-control and slow-peer pressure
        shell: bash
        run: |
          RUNWIRE_H2_PYTHON=/tmp/runwire-h2/bin/python bash benchmarks/real_protocol_pressure.sh h2 benchmark-results/real-h2-pressure

      - name: Upload independent H2 pressure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-real-h2-pressure
          path: benchmark-results/real-h2-pressure/
          retention-days: 90

      - name: Run diagnostic AUTO vs FIXED HTTP/1.1 and HTTP/2 matrix
        shell: bash
        run: |
          bash benchmarks/adaptive_http12_certify.sh 5 benchmark-results/adaptive-http12

      - name: Upload adaptive H1/H2 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-adaptive-http12
          path: benchmark-results/adaptive-http12/
          retention-days: 61

