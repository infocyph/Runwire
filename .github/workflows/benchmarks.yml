name: "Benchmarks"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  protocol-core:
    name: "Protocol + host core - PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    permissions:
      contents: read

    steps:
      - name: Checkout Runwire
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: pcntl, posix
          coverage: none

      - name: Install Runwire dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Record environment
        shell: bash
        run: |
          mkdir -p benchmark-results
          {
            php -v
            composer --version
            uname -a
            lscpu
          } > "benchmark-results/environment-php-${{ matrix.php-version }}.txt"

      - name: Run PHPBench suite
        shell: bash
        run: |
          result="benchmark-results/phpbench-php-${{ matrix.php-version }}.json"
          vendor/bin/phpbench run \
            --report=aggregate \
            --output=json \
            --progress=none \
            --bootstrap=vendor/autoload.php \
            --config=vendor/infocyph/phpforge/resources/phpbench.json \
            benchmarks > "$result"
          jq -e 'type == "array" and length > 0' "$result" >/dev/null
          cat "$result"

      - name: Validate comparative evidence gate
        shell: bash
        run: |
          mkdir -p benchmark-results/comparative-fixtures
          cat > benchmark-results/comparative-fixtures/runwire.json <<'JSON'
          {
            "runtime": "runwire-native",
            "runtime_version": "1.0-pr",
            "protocol": "http/1.1",
            "workload": "plaintext-minimal",
            "hardware_id": "ci-fixture",
            "php_version": "${{ matrix.php-version }}",
            "instrumentation": "default",
            "workers": 4,
            "concurrency": 32,
            "duration_seconds": 30,
            "throughput_rps": 1000.0,
            "latency_ms": {"p50": 1.0, "p95": 2.0, "p99": 3.0},
            "errors_total": 0,
            "error_rate": 0.0,
            "cpu_percent": 75.0,
            "rss_peak_bytes": 67108864
          }
          JSON
          cat > benchmark-results/comparative-fixtures/peer.json <<'JSON'
          {
            "runtime": "peer-runtime",
            "runtime_version": "fixture",
            "protocol": "http/1.1",
            "workload": "plaintext-minimal",
            "hardware_id": "ci-fixture",
            "php_version": "${{ matrix.php-version }}",
            "instrumentation": "default",
            "workers": 4,
            "concurrency": 32,
            "duration_seconds": 30,
            "throughput_rps": 900.0,
            "latency_ms": {"p50": 1.2, "p95": 2.4, "p99": 3.6},
            "errors_total": 0,
            "error_rate": 0.0,
            "cpu_percent": 80.0,
            "rss_peak_bytes": 75497472
          }
          JSON
          jq '.concurrency = 64' benchmark-results/comparative-fixtures/peer.json \
            > benchmark-results/comparative-fixtures/mismatch.json

          php benchmarks/comparative_evidence.php \
            benchmark-results/comparative-fixtures/runwire.json \
            benchmark-results/comparative-fixtures/peer.json \
            > benchmark-results/comparative-fixtures/rendered.md

          if php benchmarks/comparative_evidence.php \
            benchmark-results/comparative-fixtures/runwire.json \
            benchmark-results/comparative-fixtures/mismatch.json; then
            echo "comparative evidence mismatch unexpectedly passed" >&2
            exit 1
          fi

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-benchmarks-php-${{ matrix.php-version }}
          path: benchmark-results/
          retention-days: 61
