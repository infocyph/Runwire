name: "Benchmarks"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

concurrency:
  group: bm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol-core:
    name: "Protocol + host core - PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    permissions:
      contents: read

    steps:
      - name: Checkout Runwire
        uses: actions/checkout@v7 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: pcntl, posix
          coverage: none

      - name: Install Runwire dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Record environment
        shell: bash
        run: |
          mkdir -p benchmark-results
          {
            php -v
            composer --version
            uname -a
            lscpu
          } > "benchmark-results/environment-php-${{ matrix.php-version }}.txt"

      - name: Run PHPBench suite
        shell: bash
        run: |
          result="benchmark-results/phpbench-php-${{ matrix.php-version }}.json"
          vendor/bin/phpbench run \
            --report=aggregate \
            --output=json \
            --progress=none \
            --bootstrap=vendor/autoload.php \
            --config=vendor/infocyph/phpforge/resources/phpbench.json \
            benchmarks > "$result"
          jq -e 'type == "array" and length > 0' "$result" >/dev/null
          cat "$result"

      - name: Validate comparative-evidence tooling
        shell: bash
        run: |
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT

          cat > "$fixture_dir/fixture-a.json" <<'JSON'
          {
            "runtime": "validator-fixture-a",
            "runtime_version": "test-only",
            "protocol": "http/1.1",
            "workload": "validator-only",
            "hardware_id": "validator-fixture",
            "php_version": "${{ matrix.php-version }}",
            "instrumentation": "test-only",
            "workers": 1,
            "concurrency": 1,
            "duration_seconds": 1,
            "throughput_rps": 1.0,
            "latency_ms": {"p50": 1.0, "p95": 2.0, "p99": 3.0},
            "errors_total": 0,
            "error_rate": 0.0,
            "cpu_percent": 1.0,
            "rss_peak_bytes": 1
          }
          JSON
          cat > "$fixture_dir/fixture-b.json" <<'JSON'
          {
            "runtime": "validator-fixture-b",
            "runtime_version": "test-only",
            "protocol": "http/1.1",
            "workload": "validator-only",
            "hardware_id": "validator-fixture",
            "php_version": "${{ matrix.php-version }}",
            "instrumentation": "test-only",
            "workers": 1,
            "concurrency": 1,
            "duration_seconds": 1,
            "throughput_rps": 2.0,
            "latency_ms": {"p50": 1.0, "p95": 2.0, "p99": 3.0},
            "errors_total": 0,
            "error_rate": 0.0,
            "cpu_percent": 2.0,
            "rss_peak_bytes": 2
          }
          JSON
          jq '.concurrency = 2' "$fixture_dir/fixture-b.json" > "$fixture_dir/mismatch.json"

          php benchmarks/comparative_evidence.php \
            "$fixture_dir/fixture-a.json" \
            "$fixture_dir/fixture-b.json" \
            > /dev/null

          if php benchmarks/comparative_evidence.php \
            "$fixture_dir/fixture-a.json" \
            "$fixture_dir/mismatch.json" \
            > /dev/null 2>&1; then
            echo "comparative evidence mismatch unexpectedly passed" >&2
            exit 1
          fi

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-benchmarks-php-${{ matrix.php-version }}
          path: benchmark-results/
          retention-days: 61
