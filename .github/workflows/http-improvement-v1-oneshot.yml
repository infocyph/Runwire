name: "HTTP Improvement V1 One-Shot"

on:
  push:
    branches: [ "feat/http-improvement" ]
    paths:
      - ".github/workflows/http-improvement-v1-oneshot.yml"
      - "benchmarks/http1_oneshot_lab_server.php"
      - "benchmarks/http1_oneshot_certification.sh"
      - "benchmarks/patch_h1_oneshot.php"
      - "benchmarks/http1_sustained_bench.php"
      - "benchmarks/sustained_summary.php"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runwire-http-improvement-v1-oneshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-oneshot:
    name: "H1 one-shot ${{ matrix.transport }} / ${{ matrix.payload }} B"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        transport: [ plain, tls ]
        payload: [ 2, 1024, 16384, 65536 ]

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: feat/http-improvement

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: pcntl, posix, event, opcache
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Build semantic-safe one-shot candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/runwire-h1-oneshot
          mkdir -p /tmp/runwire-h1-oneshot
          tar --exclude=.git -cf - . | tar -C /tmp/runwire-h1-oneshot -xf -
          php benchmarks/patch_h1_oneshot.php /tmp/runwire-h1-oneshot
          php -l /tmp/runwire-h1-oneshot/src/Http/Http1/Http1ResponseWriter.php

      - name: Generate TLS certificate
        shell: bash
        run: |
          mkdir -p .lab
          openssl req -x509 -newkey rsa:2048 -nodes             -keyout .lab/key.pem -out .lab/cert.pem -days 1 -subj '/CN=localhost' >/dev/null 2>&1

      - name: Run semantic-safe one-shot certification
        shell: bash
        run: |
          bash benchmarks/http1_oneshot_certification.sh             "$PWD" /tmp/runwire-h1-oneshot             .lab/cert.pem .lab/key.pem             "validation-evidence/http1-oneshot-${{ matrix.transport }}-${{ matrix.payload }}"             "${{ matrix.transport }}" "${{ matrix.payload }}" 5 1

      - name: Upload one-shot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "runwire-v1-oneshot-${{ matrix.transport }}-${{ matrix.payload }}"
          path: "validation-evidence/http1-oneshot-${{ matrix.transport }}-${{ matrix.payload }}/"
          retention-days: 30
