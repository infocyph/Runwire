name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

concurrency:
  group: ss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phpforge:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      # Exact per-file skip exceptions and sanitizer evidence are audited in composer.json.
      # PHPForge defaults to a 300-second per-tool limit. Runwire's full
      # integration-heavy Pest suite may exceed that on the slowest QA lane.
      # Keep a finite 15-minute limit; genuine deadlocks still fail the job.
      quality_task_timeout_seconds: 900
      php_extensions: "pcntl, posix, openssl, sockets, event"
      integration_services: '[]'
      service_topologies: '{}'

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: infocyph/phpforge/.github/workflows/release.yml@main
    permissions:
      contents: write
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
