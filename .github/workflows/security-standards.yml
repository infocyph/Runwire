name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      php_versions: '["8.4","8.5"]'
      run_analysis: false
      # QUIC intentionally stays out of the normal PHPForge extension list.
      # This lane proves Runwire remains installable and testable without
      # native HTTP/3 capability. The dedicated http3-quic job below installs
      # and validates the optional extension against OpenSSL 3.5+.
      php_extensions: "pcntl, posix, openssl, sockets, event"
      integration_services: '[]'
      service_topologies: '{}'

  analysis:
    name: "Static analysis - PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    permissions:
      contents: read

    steps:
      - name: Checkout Runwire
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: pcntl, posix, openssl, sockets, event
          coverage: none

      - name: Install stable development dependencies
        shell: bash
        run: |
          composer validate --strict
          composer update --no-interaction --prefer-dist --no-progress --prefer-stable
          composer ic:release:constraints

      - name: Enforce dependency security audit
        shell: bash
        run: composer ic:release:audit

      - name: Enforce PHPForge quality and analyzers
        shell: bash
        run: composer ic:ci

  http3-quic:
    name: "HTTP/3 + QUIC - PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    container: "php:${{ matrix.php-version }}-cli"
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    permissions:
      contents: read

    steps:
      # These packages bootstrap the Debian-based CI container only. They are
      # not Runwire install/runtime dependencies. The independent ngtcp2 client
      # is built from pinned upstream source instead of a distro package.
      - name: Bootstrap container tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            git \
            libev-dev \
            libssl-dev \
            libtool \
            pkg-config \
            python3 \
            python3-venv \
            unzip
          rm -rf /var/lib/apt/lists/*

      - name: Checkout Runwire
        uses: actions/checkout@v7

      - name: Checkout php-quic
        uses: actions/checkout@v7
        with:
          repository: mikepultz/php-quic
          ref: main
          path: .ci/php-quic

      - name: Checkout nghttp3 interoperability dependency
        if: matrix.php-version == '8.5'
        uses: actions/checkout@v7
        with:
          repository: ngtcp2/nghttp3
          ref: v1.18.0
          path: .ci/nghttp3
          submodules: recursive

      - name: Checkout ngtcp2 interoperability client
        if: matrix.php-version == '8.5'
        uses: actions/checkout@v7
        with:
          repository: ngtcp2/ngtcp2
          ref: v1.25.0
          path: .ci/ngtcp2
          submodules: recursive

      - name: Enable Runwire process extensions
        shell: bash
        run: |
          docker-php-ext-install -j"$(nproc)" pcntl
          php -r '
          if (!extension_loaded("pcntl") || !extension_loaded("posix")) {
              fwrite(STDERR, "Runwire process extensions are unavailable.\n");
              exit(1);
          }
          '

      - name: Verify OpenSSL QUIC baseline
        shell: bash
        run: |
          php -r 'echo OPENSSL_VERSION_TEXT, PHP_EOL;'
          pkg-config --modversion libssl
          pkg-config --atleast-version=3.5.0 libssl || {
            echo "::error::Runwire native HTTP/3 requires OpenSSL 3.5+ for the current php-quic server adapter."
            exit 1
          }

      - name: Build and enable QUIC extension
        shell: bash
        working-directory: .ci/php-quic
        run: |
          phpize
          ./configure --with-quic
          make -j"$(nproc)"
          make install
          docker-php-ext-enable quic

      - name: Build independent ngtcp2 HTTP/3 client
        if: matrix.php-version == '8.5'
        shell: bash
        run: |
          pushd .ci/nghttp3
          autoreconf -i
          ./configure \
            --prefix="$GITHUB_WORKSPACE/.ci/nghttp3/build" \
            --enable-lib-only \
            --disable-dependency-tracking
          make -j"$(nproc)"
          make install
          popd

          pushd .ci/ngtcp2
          autoreconf -i
          PKG_CONFIG_PATH="$GITHUB_WORKSPACE/.ci/nghttp3/build/lib/pkgconfig" \
            ./configure --with-openssl --disable-dependency-tracking
          make -j"$(nproc)"
          test -x examples/osslclient
          popd

      - name: Verify QUIC API
        shell: bash
        run: |
          php --ri quic
          php -r '
          $valid = extension_loaded("quic")
              && class_exists("Quic\\Listener")
              && class_exists("Quic\\Connection")
              && class_exists("Quic\\Stream")
              && function_exists("Quic\\poll");
          if (!$valid) {
              fwrite(STDERR, "Required php-quic API is unavailable.\n");
              exit(1);
          }
          '

      - name: Install Composer
        shell: bash
        run: |
          php -r 'copy("https://getcomposer.org/installer", "/tmp/composer-setup.php");'
          php /tmp/composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer
          rm -f /tmp/composer-setup.php
          composer --version

      - name: Install Runwire dependencies
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          composer install --no-interaction --prefer-dist --no-progress

      - name: Verify Runwire QUIC capability detection
        shell: bash
        run: |
          php -r '
          require "vendor/autoload.php";
          $environment = (new Infocyph\Runwire\Runtime\RuntimeEnvironmentProbe())->probe();
          if (!$environment->supportsQuic) {
              fwrite(STDERR, "Runwire did not detect the installed QUIC capability.\n");
              exit(1);
          }
          '

      - name: Run focused HTTP/3 protocol tests
        shell: bash
        run: |
          test -d tests
          test -f vendor/infocyph/phpforge/resources/pest.xml
          cp vendor/infocyph/phpforge/resources/pest.xml .phpforge-pest.xml
          trap 'rm -f .phpforge-pest.xml' EXIT
          vendor/bin/pest \
            --configuration=.phpforge-pest.xml \
            tests/Http3FrameTest.php \
            tests/Http3ControlStreamTest.php \
            tests/Http3RequestStreamTest.php \
            tests/Http3ConnectionStateTest.php \
            tests/Http3ResponseWriterTest.php \
            tests/Http3SessionTest.php \
            tests/Http3ResponseSchedulerTest.php \
            tests/Http3OptionsTest.php \
            tests/Http3AbuseFaultAcceptanceTest.php \
            tests/HttpProtocolSemanticParityTest.php \
            tests/SoakAcceptanceTest.php \
            tests/PhpQuicTransportTest.php \
            tests/PhpQuicFacadeTest.php \
            tests/PhpQuicHttp3ConnectionTest.php \
            tests/PhpQuicHttp3WorkerTest.php \
            tests/QpackTest.php \
            tests/RuntimeCapabilitiesTest.php \
            tests/RuntimeEnvironmentProbeTest.php

      - name: Run independent aioquic HTTP/3 interoperability
        shell: bash
        run: |
          python3 -m venv /tmp/runwire-aioquic
          /tmp/runwire-aioquic/bin/pip install --disable-pip-version-check --no-cache-dir 'aioquic==1.3.0'

          tmpdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tmpdir/key.pem" \
            -out "$tmpdir/cert.pem" \
            -days 1 \
            -subj '/CN=localhost' >/dev/null 2>&1

          port="$(python3 - <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
              sock.bind(('127.0.0.1', 0))
              print(sock.getsockname()[1])
          PY
          )"

          php tests/fixtures/http3_interop_server.php \
            "$port" "$tmpdir/cert.pem" "$tmpdir/key.pem" "$tmpdir/ready" \
            >"$tmpdir/server.log" 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 100); do
            if [ -s "$tmpdir/ready" ]; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$tmpdir/server.log"
              exit 1
            fi
            sleep 0.02
          done
          if [ ! -s "$tmpdir/ready" ]; then
            cat "$tmpdir/server.log"
            echo '::error::Runwire HTTP/3 interoperability fixture did not become ready.'
            exit 1
          fi

          if ! /tmp/runwire-aioquic/bin/python tests/interop/aioquic_http3_client.py "$port"; then
            echo '--- Runwire aioquic interoperability server log ---'
            cat "$tmpdir/server.log"
            exit 1
          fi
          if ! wait "$server_pid"; then
            cat "$tmpdir/server.log"
            exit 1
          fi
          server_pid=""

      - name: Run native HTTP/3 soak acceptance
        shell: bash
        run: |
          test -x /tmp/runwire-aioquic/bin/python
          tmpdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tmpdir/key.pem" \
            -out "$tmpdir/cert.pem" \
            -days 1 \
            -subj '/CN=localhost' >/dev/null 2>&1

          port="$(python3 - <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
              sock.bind(('127.0.0.1', 0))
              print(sock.getsockname()[1])
          PY
          )"

          php tests/fixtures/http3_interop_server.php \
            "$port" "$tmpdir/cert.pem" "$tmpdir/key.pem" "$tmpdir/ready" 128 \
            >"$tmpdir/server.log" 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 100); do
            if [ -s "$tmpdir/ready" ]; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$tmpdir/server.log"
              exit 1
            fi
            sleep 0.02
          done
          if [ ! -s "$tmpdir/ready" ]; then
            cat "$tmpdir/server.log"
            echo '::error::Runwire HTTP/3 soak fixture did not become ready.'
            exit 1
          fi

          if ! /tmp/runwire-aioquic/bin/python tests/interop/aioquic_http3_soak.py "$port" 128; then
            echo '--- Runwire HTTP/3 soak server log ---'
            cat "$tmpdir/server.log"
            exit 1
          fi
          if ! wait "$server_pid"; then
            cat "$tmpdir/server.log"
            exit 1
          fi
          server_pid=""

      - name: Run independent ngtcp2 HTTP/3 interoperability
        if: matrix.php-version == '8.5'
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          mkdir "$tmpdir/download"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tmpdir/key.pem" \
            -out "$tmpdir/cert.pem" \
            -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1

          port="$(python3 - <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
              sock.bind(('127.0.0.1', 0))
              print(sock.getsockname()[1])
          PY
          )"

          php tests/fixtures/http3_interop_server.php \
            "$port" "$tmpdir/cert.pem" "$tmpdir/key.pem" "$tmpdir/ready" \
            >"$tmpdir/server.log" 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 100); do
            if [ -s "$tmpdir/ready" ]; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$tmpdir/server.log"
              exit 1
            fi
            sleep 0.02
          done
          if [ ! -s "$tmpdir/ready" ]; then
            cat "$tmpdir/server.log"
            echo '::error::Runwire HTTP/3 ngtcp2 interoperability fixture did not become ready.'
            exit 1
          fi

          if ! .ci/ngtcp2/examples/osslclient \
            --download="$tmpdir/download" \
            --exit-on-all-streams-close \
            127.0.0.1 "$port" "https://127.0.0.1:$port/interop-ngtcp2" \
            >"$tmpdir/client.log" 2>&1; then
            echo '--- ngtcp2 HTTP/3 client log ---'
            cat "$tmpdir/client.log"
            echo '--- Runwire ngtcp2 interoperability server log ---'
            cat "$tmpdir/server.log"
            exit 1
          fi
          if ! wait "$server_pid"; then
            cat "$tmpdir/server.log"
            exit 1
          fi
          server_pid=""

          if [ ! -f "$tmpdir/download/interop-ngtcp2" ]; then
            cat "$tmpdir/client.log"
            echo '::error::ngtcp2 did not persist the Runwire HTTP/3 response body.'
            exit 1
          fi
          if [ "$(cat "$tmpdir/download/interop-ngtcp2")" != 'runwire-ngtcp2-ok' ]; then
            cat "$tmpdir/client.log"
            echo '::error::ngtcp2 received an unexpected Runwire HTTP/3 response body.'
            exit 1
          fi
