name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

concurrency:
  group: ss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phpforge:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      php_versions: '["8.4","8.5"]'
      # QUIC intentionally stays out of the normal PHPForge extension list.
      # This lane proves Runwire remains installable and testable without
      # native HTTP/3 capability. The dedicated http3-quic job below installs
      # and validates the optional extension against OpenSSL 3.5+.
      php_extensions: "pcntl, posix, openssl, sockets, event"
      integration_services: '[]'
      service_topologies: '{}'

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: infocyph/phpforge/.github/workflows/release.yml@main
    permissions:
      contents: write
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  http3-quic:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "HTTP/3 + QUIC - PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    container: "php:${{ matrix.php-version }}-cli"
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    permissions:
      contents: read

    steps:
      # These packages bootstrap the Debian-based CI container only. They are
      # not Runwire install/runtime dependencies. The independent ngtcp2 client
      # is built from pinned upstream source instead of a distro package.
      - name: Bootstrap container tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            git \
            jq \
            libev-dev \
            libssl-dev \
            libtool \
            pkg-config \
            python3 \
            python3-venv \
            unzip
          rm -rf /var/lib/apt/lists/*

      - name: Checkout Runwire
        uses: actions/checkout@v7 # v7.0.1

      - name: Checkout php-quic
        uses: actions/checkout@v7 # v7.0.1
        with:
          repository: mikepultz/php-quic
          ref: main
          path: .ci/php-quic

      - name: Checkout nghttp3 interoperability dependency
        if: matrix.php-version == '8.5'
        uses: actions/checkout@v7 # v7.0.1
        with:
          repository: ngtcp2/nghttp3
          ref: v1.18.0
          path: .ci/nghttp3
          submodules: recursive

      - name: Checkout ngtcp2 interoperability client
        if: matrix.php-version == '8.5'
        uses: actions/checkout@v7 # v7.0.1
        with:
          repository: ngtcp2/ngtcp2
          ref: v1.25.0
          path: .ci/ngtcp2
          submodules: recursive

      - name: Enable Runwire process extensions
        shell: bash
        run: |
          docker-php-ext-install -j"$(nproc)" pcntl sockets
          php -r '
          if (!extension_loaded("pcntl") || !extension_loaded("posix") || !extension_loaded("sockets")) {
              fwrite(STDERR, "Runwire native H1/H2/H3 interop requires process and sockets extensions.\n");
              exit(1);
          }
          '

      - name: Verify OpenSSL QUIC baseline
        shell: bash
        run: |
          php -r 'echo OPENSSL_VERSION_TEXT, PHP_EOL;'
          pkg-config --modversion libssl
          pkg-config --atleast-version=3.5.0 libssl || {
            echo "::error::Runwire native HTTP/3 requires OpenSSL 3.5+ for the current php-quic server adapter."
            exit 1
          }

      - name: Build and enable QUIC extension
        shell: bash
        working-directory: .ci/php-quic
        run: |
          phpize
          ./configure --with-quic
          make -j"$(nproc)"
          make install
          docker-php-ext-enable quic

      - name: Build independent ngtcp2 HTTP/3 client
        if: matrix.php-version == '8.5'
        shell: bash
        run: |
          pushd .ci/nghttp3
          autoreconf -i
          ./configure \
            --prefix="$GITHUB_WORKSPACE/.ci/nghttp3/build" \
            --enable-lib-only \
            --disable-dependency-tracking
          make -j"$(nproc)"
          make install
          popd

          pushd .ci/ngtcp2
          autoreconf -i
          PKG_CONFIG_PATH="$GITHUB_WORKSPACE/.ci/nghttp3/build/lib/pkgconfig" \
            ./configure --with-openssl --disable-dependency-tracking
          make -j"$(nproc)"
          test -x examples/osslclient
          popd

      - name: Verify QUIC API
        shell: bash
        run: |
          php --ri quic
          php -r '
          $valid = extension_loaded("quic")
              && class_exists("Quic\\Listener")
              && class_exists("Quic\\Connection")
              && class_exists("Quic\\Stream")
              && function_exists("Quic\\poll");
          if (!$valid) {
              fwrite(STDERR, "Required php-quic API is unavailable.\n");
              exit(1);
          }
          '

      - name: Install Composer
        shell: bash
        run: |
          php -r 'copy("https://getcomposer.org/installer", "/tmp/composer-setup.php");'
          php /tmp/composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer
          rm -f /tmp/composer-setup.php
          composer --version

      - name: Install Runwire dependencies
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-event

      - name: Verify Runwire QUIC capability detection
        shell: bash
        run: |
          php -r '
          require "vendor/autoload.php";
          $environment = (new Infocyph\Runwire\Runtime\RuntimeEnvironmentProbe())->probe();
          if (!$environment->supportsQuic) {
              fwrite(STDERR, "Runwire did not detect the installed QUIC capability.\n");
              exit(1);
          }
          '

      - name: Run focused HTTP/3 protocol tests
        shell: bash
        run: |
          test -d tests
          test -f vendor/infocyph/phpforge/resources/pest.xml
          cp vendor/infocyph/phpforge/resources/pest.xml .phpforge-pest.xml
          trap 'rm -f .phpforge-pest.xml' EXIT
          vendor/bin/pest \
            --configuration=.phpforge-pest.xml \
            tests/Http3FrameTest.php \
            tests/Http3ControlStreamTest.php \
            tests/Http3RequestStreamTest.php \
            tests/Http3ConnectionStateTest.php \
            tests/Http3ResponseWriterTest.php \
            tests/Http3SessionTest.php \
            tests/Http3ResponseSchedulerTest.php \
            tests/Http3OptionsTest.php \
            tests/Http3AbuseFaultAcceptanceTest.php \
            tests/HttpProtocolSemanticParityTest.php \
            tests/SoakAcceptanceTest.php \
            tests/PhpQuicTransportTest.php \
            tests/PhpQuicFacadeTest.php \
            tests/PhpQuicHttp3ConnectionTest.php \
            tests/PhpQuicHttp3WorkerTest.php \
            tests/QpackTest.php \
            tests/RuntimeCapabilitiesTest.php \
            tests/RuntimeEnvironmentProbeTest.php

      - name: Run independent aioquic HTTP/3 interoperability
        shell: bash
        run: |
          python3 -m venv /tmp/runwire-aioquic
          /tmp/runwire-aioquic/bin/pip install --disable-pip-version-check --no-cache-dir 'aioquic==1.3.0' 'h2==4.3.0'
          /tmp/runwire-aioquic/bin/python -m unittest discover -s tests/benchmarks -p 'test_adaptive_http3_client.py' -v

          tmpdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tmpdir/key.pem" \
            -out "$tmpdir/cert.pem" \
            -days 1 \
            -subj '/CN=localhost' >/dev/null 2>&1

          port="$(php -r '
          $server = stream_socket_server("udp://127.0.0.1:0", $errno, $error, STREAM_SERVER_BIND);
          if (!is_resource($server)) {
              throw new RuntimeException($error);
          }
          $name = stream_socket_get_name($server, false);
          fclose($server);
          if (!is_string($name) || !str_contains($name, ":")) {
              throw new RuntimeException("Unable to resolve ephemeral UDP port.");
          }
          echo substr(strrchr($name, ":"), 1);
          ')"

          php tests/fixtures/http3_interop_server.php \
            "$port" "$tmpdir/cert.pem" "$tmpdir/key.pem" "$tmpdir/ready" \
            >"$tmpdir/server.log" 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 100); do
            if [ -s "$tmpdir/ready" ]; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$tmpdir/server.log"
              exit 1
            fi
            sleep 0.02
          done
          if [ ! -s "$tmpdir/ready" ]; then
            cat "$tmpdir/server.log"
            echo '::error::Runwire HTTP/3 interoperability fixture did not become ready.'
            exit 1
          fi

          if ! /tmp/runwire-aioquic/bin/python tests/interop/aioquic_http3_client.py "$port"; then
            echo '--- Runwire aioquic interoperability server log ---'
            cat "$tmpdir/server.log"
            exit 1
          fi
          if ! wait "$server_pid"; then
            cat "$tmpdir/server.log"
            exit 1
          fi
          server_pid=""

      - name: Verify off-loop outbound QUIC TLS handshake against independent aioquic
        if: matrix.php-version == '8.5'
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$tmpdir/server.key" -out "$tmpdir/ca.pem" >/dev/null 2>&1

          port="$(php -r '
          $udp = stream_socket_server("udp://127.0.0.1:0", $code, $error, STREAM_SERVER_BIND);
          if (!is_resource($udp)) { throw new RuntimeException($error); }
          $address = stream_socket_get_name($udp, false);
          fclose($udp);
          if (!is_string($address) || !str_contains($address, ":")) {
              throw new RuntimeException("Cannot allocate QUIC probe port.");
          }
          echo substr(strrchr($address, ":"), 1);
          ')"

          /tmp/runwire-aioquic/bin/python -u tests/interop/aioquic_quic_probe_server.py \
            "$port" "$tmpdir/ca.pem" "$tmpdir/server.key" "$tmpdir/ready" \
            >"$tmpdir/server.log" 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 100); do
            if [ -s "$tmpdir/ready" ]; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$tmpdir/server.log"
              exit 1
            fi
            sleep 0.03
          done
          test -s "$tmpdir/ready" || {
            cat "$tmpdir/server.log"
            echo "::error::Independent aioquic QUIC probe server did not start."
            exit 1
          }

          php tests/fixtures/quic_probe_client.php 127.0.0.1 "$port" "$tmpdir/ca.pem"

      - name: Verify persistent outbound QUIC worker streams against aioquic echo
        if: matrix.php-version == '8.5'
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$tmpdir/server.key" -out "$tmpdir/ca.pem" >/dev/null 2>&1

          port="$(php -r '
          $udp = stream_socket_server("udp://127.0.0.1:0", $code, $error, STREAM_SERVER_BIND);
          if (!is_resource($udp)) { throw new RuntimeException($error); }
          $address = stream_socket_get_name($udp, false);
          fclose($udp);
          if (!is_string($address) || !str_contains($address, ":")) {
              throw new RuntimeException("Cannot allocate QUIC echo port.");
          }
          echo substr(strrchr($address, ":"), 1);
          ')"

          /tmp/runwire-aioquic/bin/python -u tests/interop/aioquic_quic_echo_server.py \
            "$port" "$tmpdir/ca.pem" "$tmpdir/server.key" "$tmpdir/ready" "$tmpdir/uni.receipt" \
            >"$tmpdir/server.log" 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 100); do
            if [ -s "$tmpdir/ready" ]; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$tmpdir/server.log"
              exit 1
            fi
            sleep 0.03
          done
          test -s "$tmpdir/ready" || {
            cat "$tmpdir/server.log"
            echo "::error::Independent QUIC echo server did not start."
            exit 1
          }

          mkdir -p benchmark-results
          php tests/fixtures/quic_session_echo_client.php 127.0.0.1 "$port" "$tmpdir/ca.pem" "$tmpdir/uni.receipt" \
            | tee "benchmark-results/native-quic-session-php-${{ matrix.php-version }}.json"
          jq -e '.verified == true and .concurrent_bidirectional == true
            and .worker_profile.profiling == true
            and .worker_profile.worker_usage_available == true
            and .worker_profile.worker_peak_rss_kib > 0
            and .worker_profile.worker_php_peak_bytes > 0
            and .worker_profile.worker_cpu_ms >= 0
            and .worker_profile.poll_calls > 0
            and .worker_profile.write_calls > 0
            and .worker_profile.read_calls > 0
            and .worker_profile.write_bytes > 0
            and .native_reset_storm_count == 24
            and .verified_post_reset_bidi_streams == 2
            and .native_reset_then_peer_uni_fin == true
            and .unidirectional_streams_delivered == 1' \
            "benchmark-results/native-quic-session-php-${{ matrix.php-version }}.json" >/dev/null

      - name: Verify peer-initiated QUIC unidirectional streams against independent aioquic
        shell: bash
        run: |
          php -l tests/fixtures/quic_client_inbound_uni.php
          /tmp/runwire-aioquic/bin/python -m py_compile tests/interop/aioquic_quic_echo_server.py
          bash -n tests/interop/quic_peer_inbound_uni.sh
          RUNWIRE_AIOQUIC_PYTHON=/tmp/runwire-aioquic/bin/python bash tests/interop/quic_peer_inbound_uni.sh benchmark-results/native-quic-inbound.json

      - name: Prove outbound native HTTP/3 client against independent aioquic server
        shell: bash
        run: |
          php -l tests/fixtures/http3_outbound_client.php
          /tmp/runwire-aioquic/bin/python -m py_compile tests/interop/aioquic_outbound_h3_server.py
          bash -n tests/interop/http3_outbound_client.sh
          RUNWIRE_RUNTIME_BUILD="$(git rev-parse HEAD)" \
            RUNWIRE_AIOQUIC_PYTHON=/tmp/runwire-aioquic/bin/python \
            bash tests/interop/http3_outbound_client.sh \
            benchmark-results/outbound-h3-client.json \
            benchmark-results/u05-native-h3-serial-profile.json \
            benchmark-results/u07-outbound-match.json

      - name: Verify real stalled peer cancellation and healthy QUIC sibling recovery
        shell: bash
        run: |
          php -l tests/fixtures/quic_stalled_sibling.php
          /tmp/runwire-aioquic/bin/python -m py_compile tests/interop/aioquic_quic_echo_server.py
          bash -n tests/interop/quic_stalled_sibling.sh
          RUNWIRE_AIOQUIC_PYTHON=/tmp/runwire-aioquic/bin/python \
            bash tests/interop/quic_stalled_sibling.sh "benchmark-results/native-quic-stall-php-${{ matrix.php-version }}.json"
      - name: Recover native QUIC sibling streams under real independent UDP loss and reorder
        if: matrix.php-version == '8.5'
        shell: bash
        run: |
          /tmp/runwire-aioquic/bin/python -m py_compile tests/interop/aioquic_quic_echo_server.py
          bash -n tests/interop/quic_impaired_native_session.sh
          RUNWIRE_AIOQUIC_PYTHON=/tmp/runwire-aioquic/bin/python \
            bash tests/interop/quic_impaired_native_session.sh \
            "benchmark-results/native-quic-impaired-php-${{ matrix.php-version }}.json"

      - name: Upload independent native QUIC sibling/reset evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-native-quic-session-php-${{ matrix.php-version }}
          path: |
            benchmark-results/native-quic-session-php-${{ matrix.php-version }}.json
            benchmark-results/native-quic-inbound.json
            benchmark-results/native-quic-stall-php-${{ matrix.php-version }}.json
            benchmark-results/native-quic-stall-php-${{ matrix.php-version }}-peer.json
            benchmark-results/outbound-h3-client.json
            benchmark-results/u05-native-h3-serial-profile.json
            benchmark-results/u07-outbound-match.json
            benchmark-results/native-quic-impaired-php-${{ matrix.php-version }}.json
            benchmark-results/native-quic-impaired-php-${{ matrix.php-version }}-peer.json
          retention-days: 90

      - name: Real aioquic HTTP/3 stream cancellations and sibling progress
        shell: bash
        run: |
          RUNWIRE_AIOQUIC_PYTHON=/tmp/runwire-aioquic/bin/python bash benchmarks/http3_fault_acceptance.sh

      - name: Install independent HTTP/2 client in aioquic environment
        if: matrix.php-version == '8.5'
        shell: bash
        run: |
          /tmp/runwire-aioquic/bin/pip install --disable-pip-version-check --no-cache-dir 'h2==4.3.0'

      - name: Real simultaneous H1/H2/H3/TCP/UDP native crash and rolling recycle
        if: matrix.php-version == '8.5'
        shell: bash
        run: |
          mkdir -p benchmark-results
          /tmp/runwire-aioquic/bin/python benchmarks/mixed_native_lifecycle.py | tee benchmark-results/mixed-native-lifecycle.json
          jq -e '.correctness_passed == true and .events.reload_completed > 0
            and .events.manual_recycle_requested > 0 and .simultaneous_h2_streams_per_wave == 8
            and .simultaneous_h3_streams_per_wave == 8
            and .cancelled_h2_streams_per_wave == 1
            and .cancelled_h3_streams_per_wave == 1
            and .slow_receiver_delay_ms == 20
            and ([.waves[] | select(.http2 != 8 or .http3 != 8
                 or .cancelled_h2_streams != 1 or .cancelled_h3_streams != 1)] | length) == 0' benchmark-results/mixed-native-lifecycle.json >/dev/null

      - name: Upload mixed native listener lifecycle evidence
        if: always() && matrix.php-version == '8.5'
        uses: actions/upload-artifact@v7
        with:
          name: runwire-mixed-native-lifecycle
          path: benchmark-results/mixed-native-lifecycle.json
          retention-days: 90

      - name: Real independent H3 QPACK, upload and connection-churn pressure
        if: matrix.php-version == '8.5'
        shell: bash
        run: |
          RUNWIRE_AIOQUIC_PYTHON=/tmp/runwire-aioquic/bin/python bash benchmarks/real_protocol_pressure.sh h3 benchmark-results/real-h3-pressure

      - name: Upload independent H3 pressure artifacts
        if: always() && matrix.php-version == '8.5'
        uses: actions/upload-artifact@v7
        with:
          name: runwire-real-h3-pressure
          path: benchmark-results/real-h3-pressure/
          retention-days: 90

      - name: Run diagnostic AUTO vs FIXED HTTP/3 matrix
        if: matrix.php-version == '8.5'
        shell: bash
        run: |
          bash benchmarks/adaptive_http3_certify.sh 5 benchmark-results/adaptive-http3

      - name: Upload adaptive HTTP/3 evidence
        if: always() && matrix.php-version == '8.5'
        uses: actions/upload-artifact@v7
        with:
          name: runwire-adaptive-http3
          path: benchmark-results/adaptive-http3/
          retention-days: 61

      - name: Run native HTTP/3 soak acceptance
        shell: bash
        run: |
          test -x /tmp/runwire-aioquic/bin/python
          tmpdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tmpdir/key.pem" \
            -out "$tmpdir/cert.pem" \
            -days 1 \
            -subj '/CN=localhost' >/dev/null 2>&1

          port="$(php -r '
          $server = stream_socket_server("udp://127.0.0.1:0", $errno, $error, STREAM_SERVER_BIND);
          if (!is_resource($server)) {
              throw new RuntimeException($error);
          }
          $name = stream_socket_get_name($server, false);
          fclose($server);
          if (!is_string($name) || !str_contains($name, ":")) {
              throw new RuntimeException("Unable to resolve ephemeral UDP port.");
          }
          echo substr(strrchr($name, ":"), 1);
          ')"

          php tests/fixtures/http3_interop_server.php \
            "$port" "$tmpdir/cert.pem" "$tmpdir/key.pem" "$tmpdir/ready" 128 \
            >"$tmpdir/server.log" 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 100); do
            if [ -s "$tmpdir/ready" ]; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$tmpdir/server.log"
              exit 1
            fi
            sleep 0.02
          done
          if [ ! -s "$tmpdir/ready" ]; then
            cat "$tmpdir/server.log"
            echo '::error::Runwire HTTP/3 soak fixture did not become ready.'
            exit 1
          fi

          if ! /tmp/runwire-aioquic/bin/python tests/interop/aioquic_http3_soak.py "$port" 128; then
            echo '--- Runwire HTTP/3 soak server log ---'
            cat "$tmpdir/server.log"
            exit 1
          fi
          if ! wait "$server_pid"; then
            cat "$tmpdir/server.log"
            exit 1
          fi
          server_pid=""

      - name: Run independent ngtcp2 HTTP/3 interoperability
        if: matrix.php-version == '8.5'
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          mkdir "$tmpdir/download"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tmpdir/key.pem" \
            -out "$tmpdir/cert.pem" \
            -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1

          port="$(php -r '
          $server = stream_socket_server("udp://127.0.0.1:0", $errno, $error, STREAM_SERVER_BIND);
          if (!is_resource($server)) {
              throw new RuntimeException($error);
          }
          $name = stream_socket_get_name($server, false);
          fclose($server);
          if (!is_string($name) || !str_contains($name, ":")) {
              throw new RuntimeException("Unable to resolve ephemeral UDP port.");
          }
          echo substr(strrchr($name, ":"), 1);
          ')"

          php tests/fixtures/http3_interop_server.php \
            "$port" "$tmpdir/cert.pem" "$tmpdir/key.pem" "$tmpdir/ready" \
            >"$tmpdir/server.log" 2>&1 &
          server_pid=$!

          for attempt in $(seq 1 100); do
            if [ -s "$tmpdir/ready" ]; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$tmpdir/server.log"
              exit 1
            fi
            sleep 0.02
          done
          if [ ! -s "$tmpdir/ready" ]; then
            cat "$tmpdir/server.log"
            echo '::error::Runwire HTTP/3 ngtcp2 interoperability fixture did not become ready.'
            exit 1
          fi

          if ! .ci/ngtcp2/examples/osslclient \
            --download="$tmpdir/download" \
            --exit-on-all-streams-close \
            127.0.0.1 "$port" "https://127.0.0.1:$port/interop-ngtcp2" \
            >"$tmpdir/client.log" 2>&1; then
            echo '--- ngtcp2 HTTP/3 client log ---'
            cat "$tmpdir/client.log"
            echo '--- Runwire ngtcp2 interoperability server log ---'
            cat "$tmpdir/server.log"
            exit 1
          fi
          if ! wait "$server_pid"; then
            cat "$tmpdir/server.log"
            exit 1
          fi
          server_pid=""

          if [ ! -f "$tmpdir/download/interop-ngtcp2" ]; then
            cat "$tmpdir/client.log"
            echo '::error::ngtcp2 did not persist the Runwire HTTP/3 response body.'
            exit 1
          fi
          if [ "$(cat "$tmpdir/download/interop-ngtcp2")" != 'runwire-ngtcp2-ok' ]; then
            cat "$tmpdir/client.log"
            echo '::error::ngtcp2 received an unexpected Runwire HTTP/3 response body.'
            exit 1
          fi
