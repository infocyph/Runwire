name: QA Autofix

on:
  push:
    branches:
      - runwire-1.0/foundation-3-launch
    paths:
      - .github/workflows/qa-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: runwire-1.0/foundation-3-launch
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: pcntl, posix, openssl, sockets, event
          coverage: none

      - name: Install QA dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Apply PHPForge canonical fixes
        run: composer ic:process

      - name: Discard dependency-lock refresh
        shell: bash
        run: |
          if git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            git restore composer.lock
          else
            rm -f composer.lock
          fi

      - name: Commit generated fixes
        shell: bash
        run: |
          git config user.name 'A. B. M. Mahmudul Hasan'
          git config user.email 'abmmhasan@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated fixes to commit.'
            exit 0
          fi
          git commit -m 'style: apply PHPForge QA fixes'
          git push origin HEAD:runwire-1.0/foundation-3-launch
