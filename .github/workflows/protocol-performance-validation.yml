name: "Protocol Performance Validation"

on:
  push:
    branches: [ "benchmarks/1.0-vs-2.0" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runwire-protocol-performance-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  http1-write-shape:
    name: "HTTP/1 real write-shape validation"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout playground
        uses: actions/checkout@v7
        with:
          ref: benchmarks/1.0-vs-2.0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: pcntl, posix, event, opcache
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Build benchmark-only coalescing variant
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/runwire-h1-coalesce
          mkdir -p /tmp/runwire-h1-coalesce
          tar --exclude=.git -cf - . | tar -C /tmp/runwire-h1-coalesce -xf -
          php benchmarks/patch_h1_coalesce.php /tmp/runwire-h1-coalesce
          php -l /tmp/runwire-h1-coalesce/src/Http/Http1/Http1ResponseWriter.php

      - name: Generate TLS certificate
        shell: bash
        run: |
          mkdir -p .lab
          openssl req -x509 -newkey rsa:2048 -nodes             -keyout .lab/key.pem -out .lab/cert.pem -days 1 -subj '/CN=localhost' >/dev/null 2>&1

      - name: Run H1 default vs NODELAY vs coalescing
        shell: bash
        run: |
          bash benchmarks/http1_coalesce_validation.sh             "$PWD" /tmp/runwire-h1-coalesce             .lab/cert.pem .lab/key.pem             validation-evidence/http1-write-shape 5 1

      - name: Upload H1 validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-validation-http1-write-shape
          path: validation-evidence/http1-write-shape/
          retention-days: 30

  http2-write-shape:
    name: "HTTP/2 real frame coalescing validation"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout playground
        uses: actions/checkout@v7
        with:
          ref: benchmarks/1.0-vs-2.0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: pcntl, posix, event, opcache
          coverage: none

      - name: Install h2load
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nghttp2-client

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Build benchmark-only H2 coalescing variant
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/runwire-h2-coalesce
          mkdir -p /tmp/runwire-h2-coalesce
          tar --exclude=.git -cf - . | tar -C /tmp/runwire-h2-coalesce -xf -
          php benchmarks/patch_h2_coalesce.php /tmp/runwire-h2-coalesce
          php -l /tmp/runwire-h2-coalesce/src/Http/Http2/Internal/ResponseScheduler.php

      - name: Generate TLS certificate
        shell: bash
        run: |
          mkdir -p .lab
          openssl req -x509 -newkey rsa:2048 -nodes             -keyout .lab/key.pem -out .lab/cert.pem -days 1 -subj '/CN=localhost' >/dev/null 2>&1

      - name: Run H2 default vs NODELAY vs coalescing
        shell: bash
        run: |
          bash benchmarks/http2_coalesce_validation.sh             "$PWD" /tmp/runwire-h2-coalesce             .lab/cert.pem .lab/key.pem             validation-evidence/http2-write-shape 5

      - name: Upload H2 validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-validation-http2-write-shape
          path: validation-evidence/http2-write-shape/
          retention-days: 30

  backend-same-runner:
    name: "EventLoop vs SelectLoop same runner"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout playground
        uses: actions/checkout@v7
        with:
          ref: benchmarks/1.0-vs-2.0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: pcntl, posix, event, opcache
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Run alternating same-runner backend trials
        shell: bash
        run: |
          bash benchmarks/backend_same_runner_validation.sh             "$PWD" validation-evidence/backend-same-runner 3

      - name: Upload backend comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-validation-backend-same-runner
          path: validation-evidence/backend-same-runner/
          retention-days: 30

  http3-sustained:
    name: "HTTP/3 repeated sustained diagnostics"
    runs-on: ubuntu-latest
    container: php:8.5-cli
    timeout-minutes: 45

    steps:
      - name: Bootstrap QUIC build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends             autoconf automake build-essential ca-certificates git jq libev-dev libssl-dev             libtool openssl pkg-config unzip
          rm -rf /var/lib/apt/lists/*

      - name: Checkout playground
        uses: actions/checkout@v7
        with:
          ref: benchmarks/1.0-vs-2.0
          path: control

      - name: Checkout php-quic
        uses: actions/checkout@v7
        with:
          repository: mikepultz/php-quic
          ref: main
          path: .ci/php-quic

      - name: Checkout nghttp3
        uses: actions/checkout@v7
        with:
          repository: ngtcp2/nghttp3
          ref: v1.18.0
          path: .ci/nghttp3
          submodules: recursive

      - name: Checkout ngtcp2
        uses: actions/checkout@v7
        with:
          repository: ngtcp2/ngtcp2
          ref: v1.25.0
          path: .ci/ngtcp2
          submodules: recursive

      - name: Enable PHP process extensions
        run: docker-php-ext-install -j"$(nproc)" pcntl

      - name: Verify QUIC OpenSSL baseline
        shell: bash
        run: |
          pkg-config --modversion libssl
          pkg-config --atleast-version=3.5.0 libssl

      - name: Build php-quic
        shell: bash
        working-directory: .ci/php-quic
        run: |
          phpize
          ./configure --with-quic
          make -j"$(nproc)"
          make install
          docker-php-ext-enable quic

      - name: Build native HTTP/3 load client
        shell: bash
        run: |
          pushd .ci/nghttp3
          autoreconf -i
          ./configure             --prefix="$GITHUB_WORKSPACE/.ci/nghttp3/build"             --enable-lib-only             --disable-dependency-tracking
          make -j"$(nproc)"
          make install
          popd

          pushd .ci/ngtcp2
          autoreconf -i
          PKG_CONFIG_PATH="$GITHUB_WORKSPACE/.ci/nghttp3/build/lib/pkgconfig"             ./configure --with-openssl --disable-dependency-tracking
          make -j"$(nproc)"
          test -x examples/osslclient
          popd

      - name: Install Composer
        shell: bash
        run: |
          php -r 'copy("https://getcomposer.org/installer", "/tmp/composer-setup.php");'
          php /tmp/composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer
          rm -f /tmp/composer-setup.php

      - name: Install Runwire production dependencies
        run: composer install --working-dir=control --no-dev --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-event

      - name: Generate QUIC certificate
        shell: bash
        run: |
          mkdir -p .lab
          openssl req -x509 -newkey rsa:2048 -nodes             -keyout .lab/key.pem -out .lab/cert.pem -days 1 -subj '/CN=localhost' >/dev/null 2>&1

      - name: Run repeated H3 diagnostics
        shell: bash
        run: |
          bash control/benchmarks/http3_sustained_validation.sh             control .ci/ngtcp2/examples/osslclient             .lab/cert.pem .lab/key.pem             validation-evidence/http3-sustained 25000 5

      - name: Upload H3 sustained evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-validation-http3-sustained
          path: validation-evidence/http3-sustained/
          retention-days: 30
