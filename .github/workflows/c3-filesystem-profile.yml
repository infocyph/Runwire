name: "Runwire C3 Real Filesystem Worker Comparison"

on:
  push:
    branches: [ "plan/runwire-independent-ecosystem-roadmaps" ]
    paths:
      - ".github/workflows/c3-filesystem-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c3-filesystem-${{ github.sha }}
  cancel-in-progress: false

jobs:
  real-file-worker-profile:
    name: "C3 paired process worker I/O - PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pcntl, posix, opcache
          tools: composer:v2
          coverage: none
      - name: Install standalone Runwire
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate benchmark and comparison commands
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/u11_fs_worker_compare.py
          php -l benchmarks/async_file_worker_profile.php
      - name: Collect five paired, verified filesystem process workloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/c3-filesystem
          : > build/c3-filesystem/one.jsonl
          : > build/c3-filesystem/two.jsonl
          for trial in 1 2 3 4 5; do
            if (( trial % 2 == 0 )); then workgroups=(2 1); else workgroups=(1 2); fi
            for workers in "${workgroups[@]}"; do
              for sample in 1 2 3 4 5 6 7 8; do
                php -d opcache.enable_cli=1 benchmarks/async_file_worker_profile.php 64 65536 "$workers" \
                  | jq -c --argjson trial "$trial" --argjson sample "$sample" \
                    '. + {trial: $trial, sample: $sample}' \
                  >> "build/c3-filesystem/$([ "$workers" -eq 1 ] && echo one || echo two).jsonl"
              done
            done
          done
          python3 benchmarks/u11_fs_worker_compare.py \
            build/c3-filesystem/one.jsonl build/c3-filesystem/two.jsonl build/c3-filesystem/comparison.json
          jq -e '.schema_version == 1 and .trials == 5 and .samples_per_trial == 8
            and .same_operations_and_payload == true and .correctness_passed == true
            and .release_certified == false and (.speedup_median | type == "number")
            and (.single_worker.trial_summaries | length) == 5
            and (.two_workers.trial_summaries | length) == 5' build/c3-filesystem/comparison.json >/dev/null
      - name: Archive true measurements and immutable source for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-c3-fs-worker-php-${{ matrix.php-version }}-${{ github.sha }}
          path: build/c3-filesystem/
          retention-days: 90
          if-no-files-found: warn
