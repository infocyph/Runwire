name: "Release Certification"

# Intentionally opt-in: a 30-minute soak and 5 x 180-second paired comparison
# are run for a selected final candidate, never on routine PR synchronize.
# A new commit does not silently cancel an earlier manual certification run.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character Runwire 3.0 candidate commit SHA (never default to main)"
        required: true
        type: string
  pull_request:
    types: [labeled]
    branches: [ "main", "master", "develop", "development" ]

concurrency:
  group: release-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASELINE_SHA: 7e9bf20ad0737a187dfed77b723791b141b36378
  CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}

jobs:
  release-preflight:
    name: "Immutable source and 175-task tracker preflight"
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'release-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      task_total: ${{ steps.verify.outputs.task_total }}
      task_open: ${{ steps.verify.outputs.task_open }}
    steps:
      - name: Checkout selected 3.0 source, not default main
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
      - name: Reject incomplete tracker or unpinned source before expensive certification
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Release requires exact 40-character SHA."
            exit 1
          }
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA,,}"
          plan=docs/plans/runwire-3.0-unified-runtime-development-plan.md
          test -f "$plan"
          total="$(grep -Ec '^- \[[x ]\] \*\*U[0-9]{2}\.[0-9]{2}\*\*' "$plan")"
          open="$(grep -Ec '^- \[ \] \*\*U[0-9]{2}\.[0-9]{2}\*\*' "$plan" || true)"
          echo "task_total=$total" >> "$GITHUB_OUTPUT"
          echo "task_open=$open" >> "$GITHUB_OUTPUT"
          if [ "$total" -ne 175 ] || [ "$open" -ne 0 ]; then
            echo "::error::3.0 cannot be release-certified: $open of $total planned tasks remain unaccepted."
            exit 1
          fi

  matched-performance:
    name: "Matched baseline/candidate - PHP 8.5"
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'release-certification'
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout candidate exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
      - name: Reject an unpinned, incomplete or incorrect candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Release certification requires a complete 40-character candidate SHA."
            exit 1
          }
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${CANDIDATE_SHA,,}" || {
            echo "::error::Checkout revision does not match frozen candidate SHA."
            exit 1
          }
          printf 'Frozen 3.0 candidate: %s\n' "$actual"

          path: candidate

      - name: Checkout published 2.1.2 baseline at immutable SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Validate explicit candidate SHA before immutable comparison
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Manual release certification must pin a full candidate SHA."
            exit 1
          }

      - name: Verify immutable source identities
        shell: bash
        env:
          EXPECTED_CANDIDATE: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
        run: |
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          printf 'Release baseline: %s\nRelease candidate: %s\n' "$BASELINE_SHA" "$EXPECTED_CANDIDATE"

      - name: Setup matched PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: pcntl, posix, event, opcache
          coverage: none

      - name: Verify release extensions
        shell: bash
        run: |
          php -r '
          foreach (["pcntl", "posix", "event", "Zend OPcache"] as $extension) {
              if (!extension_loaded($extension)) {
                  throw new RuntimeException("Missing release extension: " . $extension);
              }
          }
          '

      - name: Install candidate and baseline dependencies
        shell: bash
        run: |
          composer install --working-dir=candidate --no-interaction --prefer-dist --no-progress
          composer install --working-dir=baseline --no-interaction --prefer-dist --no-progress

      - name: Test sustained benchmark accounting
        working-directory: candidate
        shell: bash
        run: |
          cp vendor/infocyph/phpforge/resources/pest.xml .phpforge-pest-benchmark.xml
          trap 'rm -f .phpforge-pest-benchmark.xml' EXIT
          vendor/bin/pest --configuration=.phpforge-pest-benchmark.xml tests/Http1SustainedBenchTest.php

      - name: Run matched sustained comparison
        shell: bash
        env:
          RUNWIRE_BASELINE_BUILD: ${{ env.BASELINE_SHA }}
          RUNWIRE_CANDIDATE_BUILD: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
        run: |
          bash candidate/benchmarks/matched_release_certification.sh             baseline candidate release-certification/matched

      - name: Upload matched performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-release-matched-performance
          path: release-certification/matched/
          retention-days: 90

  candidate-soak:
    name: "Candidate 30-minute HTTP soak - PHP 8.5"
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'release-certification'
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout candidate exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
      - name: Reject an unpinned, incomplete or incorrect candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Release certification requires a complete 40-character candidate SHA."
            exit 1
          }
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${CANDIDATE_SHA,,}" || {
            echo "::error::Checkout revision does not match frozen candidate SHA."
            exit 1
          }
          printf 'Frozen 3.0 candidate: %s\n' "$actual"


      - name: Setup release PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: pcntl, posix, event, opcache
          coverage: none

      - name: Install candidate dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run 30-minute sustained soak
        shell: bash
        env:
          RUNWIRE_CANDIDATE_BUILD: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-certification/soak
          port="$(php -r '
          $server = stream_socket_server("tcp://127.0.0.1:0", $errno, $error);
          if (!is_resource($server)) {
              throw new RuntimeException($error);
          }
          $name = stream_socket_get_name($server, false);
          fclose($server);
          echo substr(strrchr((string) $name, ":"), 1);
          ')"
          server_pid=""
          sampler_pid=""
          telemetry_pid=""
          cleanup() {
            if [ -n "$telemetry_pid" ] && kill -0 "$telemetry_pid" 2>/dev/null; then
              kill -TERM "$telemetry_pid" 2>/dev/null || true
              wait "$telemetry_pid" 2>/dev/null || true
            fi
            if [ -n "$sampler_pid" ] && kill -0 "$sampler_pid" 2>/dev/null; then
              kill -TERM "$sampler_pid" 2>/dev/null || true
              wait "$sampler_pid" 2>/dev/null || true
            fi
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          RUNWIRE_SOAK_DIAGNOSTICS=1 php -d opcache.enable_cli=1 benchmarks/http1_server.php "$port"             > release-certification/soak/server.log 2>&1 &
          server_pid=$!

          for _ in $(seq 1 300); do
            if php -r '
          $socket = @stream_socket_client("tcp://127.0.0.1:" . $argv[1], $errno, $error, 0.05);
          if (!is_resource($socket)) {
              throw new RuntimeException($error);
          }
          fclose($socket);
          ' "$port" >/dev/null 2>&1
            then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat release-certification/soak/server.log
              exit 1
            fi
            sleep 0.02
          done

          export RUNWIRE_RUNTIME_VERSION="3.0.0-candidate"
          export RUNWIRE_RUNTIME_BUILD="$RUNWIRE_CANDIDATE_BUILD"
          export RUNWIRE_PHP_VERSION="$(php -r 'echo PHP_VERSION;')"
          export RUNWIRE_INSTRUMENTATION="release-certification-soak"
          export RUNWIRE_OPCACHE="$(php -d opcache.enable_cli=1 -r 'echo function_exists("opcache_get_status") && opcache_get_status(false) !== false ? "enabled-cli" : "disabled";')"
          export RUNWIRE_EXTENSION_VERSIONS="$(php -r '
          $extensions = ["pcntl", "posix", "event", "Zend OPcache"];
          $values = [];
          foreach ($extensions as $extension) {
              if (!extension_loaded($extension)) {
                  continue;
              }
              $version = phpversion($extension);
              $values[] = $extension . "=" . (is_string($version) && $version !== "" ? $version : "builtin");
          }
          echo implode(",", $values);
          ')"

          test "$RUNWIRE_OPCACHE" = "enabled-cli"
          curl -fsS --http1.1 --max-time 3 -H 'Connection: close' \
            "http://127.0.0.1:$port/__runwire_soak_diagnostics" \
            > release-certification/soak/internal-initial.json
          jq -e '.gc_enabled == true and .opcache_enabled == true
            and .allocated_bytes > 0 and .gc_roots >= 0 and .opcache_used_bytes > 0' \
            release-certification/soak/internal-initial.json >/dev/null
          php benchmarks/soak_resource_profile.php sample "$server_pid" release-certification/soak/resources.csv 15 \
            > release-certification/soak/resource-sampler.log 2>&1 &
          sampler_pid=$!
          php benchmarks/soak_runtime_telemetry.php sample "$port" "$server_pid" \
            release-certification/soak/internal-worker.jsonl 15 \
            > release-certification/soak/internal-telemetry.log 2>&1 &
          telemetry_pid=$!
          php benchmarks/http1_sustained_bench.php             "$port" 32 30 1800 "$server_pid"             > release-certification/soak/http1-30m.json
          kill -TERM "$sampler_pid" 2>/dev/null || true
          wait "$sampler_pid" 2>/dev/null || true
          sampler_pid=""
          kill -TERM "$telemetry_pid" 2>/dev/null || true
          wait "$telemetry_pid" 2>/dev/null || true
          telemetry_pid=""
          php benchmarks/soak_runtime_telemetry.php analyze \
            release-certification/soak/internal-worker.jsonl \
            release-certification/soak/internal-analysis.json
          jq -e '.passed == true' release-certification/soak/internal-analysis.json >/dev/null
          php benchmarks/soak_resource_profile.php analyze \
            release-certification/soak/resources.csv release-certification/soak/resource-analysis.json
          jq -e '.passed == true' release-certification/soak/resource-analysis.json >/dev/null

          jq -e '
            .correctness_passed == true
            and .successful_requests == .requests_total
            and .errors_total == 0
            and .timeouts_total == 0
            and .validation_failures == 0
          ' release-certification/soak/http1-30m.json >/dev/null
          cat release-certification/soak/http1-30m.json

          kill -TERM "$server_pid"
          wait "$server_pid"
          server_pid=""

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-release-30m-soak
          path: release-certification/soak/
          retention-days: 90

  consumer-app:
    name: "Standalone Runwire package / native HTTP - PHP ${{ matrix.php-version }}"
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'release-certification'
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]

    steps:
      - name: Checkout exact Runwire candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
          path: runwire

      - name: Setup standalone consumer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: pcntl, posix, event, opcache
          coverage: none

      - name: Reject a non-immutable consumer candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Consumer certification requires frozen 40-character SHA."
            exit 1
          }
          test "$(git -C runwire rev-parse HEAD)" = "${CANDIDATE_SHA,,}"

      - name: Archive exact candidate and install into isolated Composer consumer
        shell: bash
        env:
          EXPECTED_CANDIDATE: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C runwire rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          mkdir -p release-certification/standalone
          workspace="$(mktemp -d)"
          echo "$workspace" > release-certification/standalone/workspace-path
          mkdir -p "$workspace/package" "$workspace/consumer"
          (
            cd runwire
            composer validate --strict --no-check-publish
            composer archive --format=zip --dir=../release-certification/standalone --file=runwire-candidate
          )
          unzip -q release-certification/standalone/runwire-candidate.zip -d "$workspace/package"
          test -f "$workspace/package/composer.json"
          test -f "$workspace/package/src/RuntimeOptions.php"
          test ! -e "$workspace/package/vendor"
          test ! -e "$workspace/package/tests"
          cat > "$workspace/consumer/composer.json" <<'JSON'
          {
            "name": "runwire/standalone-release-smoke",
            "type": "project",
            "repositories": [
              {"type": "path", "url": "../package", "options": {"symlink": false, "versions": {"infocyph/runwire": "3.0.x-dev"}}}
            ],
            "require": {"infocyph/runwire": "3.0.x-dev"},
            "minimum-stability": "dev",
            "prefer-stable": true
          }
          JSON
          composer install --working-dir="$workspace/consumer" --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer show --working-dir="$workspace/consumer" --format=json infocyph/runwire \
            | jq -e '.versions | index("3.0.x-dev") != null' >/dev/null
          composer check-platform-reqs --working-dir="$workspace/consumer" --no-dev
          cmp runwire/src/RuntimeOptions.php "$workspace/consumer/vendor/infocyph/runwire/src/RuntimeOptions.php"
          cmp runwire/composer.json "$workspace/consumer/vendor/infocyph/runwire/composer.json"
          (
            cd "$workspace/consumer"
            php -r '
              require "vendor/autoload.php";
              $options = new Infocyph\Runwire\RuntimeOptions();
              if ($options->driver !== Infocyph\Runwire\Runtime\Enum\RuntimeDriver::AUTO
                  || $options->opcache !== Infocyph\Runwire\Runtime\Enum\OpcacheMode::AUTO
                  || !class_exists(Infocyph\Runwire\Runtime::class)) {
                  throw new RuntimeException("Standalone candidate autoload or defaults differ.");
              }
            '
          )

      - name: Exercise installed package through native HTTP/1.1 server
        shell: bash
        env:
          RUNWIRE_CANDIDATE_BUILD: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          workspace="$(cat release-certification/standalone/workspace-path)"
          mkdir -p "$workspace/consumer/benchmarks"
          cp runwire/benchmarks/http1_server.php "$workspace/consumer/benchmarks/http1_server.php"
          port="$(php -r '
            $socket = stream_socket_server("tcp://127.0.0.1:0", $errno, $error);
            if (!is_resource($socket)) { throw new RuntimeException($error); }
            $address = stream_socket_get_name($socket, false);
            fclose($socket);
            echo substr(strrchr((string) $address, ":"), 1);
          ')"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$workspace"
          }
          trap cleanup EXIT
          php -d opcache.enable_cli=1 "$workspace/consumer/benchmarks/http1_server.php" "$port" \
            > release-certification/standalone/server.log 2>&1 &
          server_pid=$!
          ready=0
          for attempt in $(seq 1 100); do
            if curl -fsS --http1.1 --max-time 2 -H 'Connection: close' \
              "http://127.0.0.1:$port/benchmark" \
              -o release-certification/standalone/body.txt 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat release-certification/standalone/server.log
              exit 1
            fi
            sleep 0.05
          done
          if [ "$ready" -ne 1 ] || [ "$(cat release-certification/standalone/body.txt)" != "ok" ]; then
            cat release-certification/standalone/server.log
            echo "::error::Standalone native HTTP success response invalid or unavailable."
            exit 1
          fi
          invalid_status="$(curl -sS --http1.1 --max-time 5 -H 'Connection: close' \
            "http://127.0.0.1:$port/invalid" \
            -o release-certification/standalone/invalid-body.txt -w '%{http_code}')"
          if [ "$invalid_status" != "400" ] || [ "$(cat release-certification/standalone/invalid-body.txt)" != "bad" ]; then
            echo "::error::Standalone native HTTP invalid-path response failed."
            exit 1
          fi
          jq -n \
            --arg source_sha "$RUNWIRE_CANDIDATE_BUILD" \
            --arg php_version "$(php -r 'echo PHP_VERSION;')" \
            --arg archive "runwire-candidate.zip" \
            '{
              consumer: "standalone-runwire-composer",
              source_sha: $source_sha,
              php_version: $php_version,
              archive: $archive,
              isolated_composer_install: true,
              autoload_and_defaults: true,
              native_http_success_200: true,
              native_http_invalid_400: true,
              correctness_passed: true
            }' > release-certification/standalone/result.json
          jq -e '.correctness_passed and .isolated_composer_install
                 and .native_http_success_200 and .native_http_invalid_400' \
            release-certification/standalone/result.json >/dev/null

      - name: Upload standalone consumer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-release-consumer-standalone-php-${{ matrix.php-version }}
          path: |
            release-certification/standalone/result.json
            release-certification/standalone/server.log
          retention-days: 90

  release-guard:
    name: "PHPForge release guard with ext-event"
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'release-certification'
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout candidate exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
      - name: Reject an unpinned, incomplete or incorrect candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Release certification requires a complete 40-character candidate SHA."
            exit 1
          }
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${CANDIDATE_SHA,,}" || {
            echo "::error::Checkout revision does not match frozen candidate SHA."
            exit 1
          }
          printf 'Frozen 3.0 candidate: %s\n' "$actual"


      - name: Setup release-analysis runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: pcntl, posix, event, opcache
          coverage: none

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prove ext-event analysis prerequisite
        shell: bash
        run: |
          php -r '
          if (!extension_loaded("event") || !class_exists(Event::class, false) || !class_exists(EventBase::class, false)) {
              throw new RuntimeException("ext-event release-analysis prerequisite is unavailable.");
          }
          '
          composer check-platform-reqs

      - name: Run exact PHPForge release guard
        run: composer ic:release:guard

  release-evidence-gate:
    name: "All mandatory frozen-source certification gates"
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'release-certification')
    needs:
      - release-preflight
      - matched-performance
      - candidate-soak
      - consumer-app
      - release-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      EXPECTED_CANDIDATE: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
      PRECHECK: ${{ needs['release-preflight'].result }}
      OPEN_TASKS: ${{ needs['release-preflight'].outputs.task_open }}
      MATCHED: ${{ needs['matched-performance'].result }}
      SOAK: ${{ needs['candidate-soak'].result }}
      CONSUMER: ${{ needs['consumer-app'].result }}
      PHPFORGE: ${{ needs['release-guard'].result }}
    steps:
      - name: Check every required release gate and create non-publishing decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-certification
          [[ "$EXPECTED_CANDIDATE" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::No immutable release candidate was selected."
            exit 1
          }
          jq -n --arg sha "$EXPECTED_CANDIDATE" \
            --arg precheck "$PRECHECK" \
            --arg task_open "$OPEN_TASKS" \
            --arg matched "$MATCHED" \
            --arg soak "$SOAK" \
            --arg consumer "$CONSUMER" \
            --arg phpforge "$PHPFORGE" \
            '{
              source_sha: $sha,
              tracker_preflight: $precheck,
              open_tasks: ($task_open | tonumber? // -1),
              release_tag_created: false,
              package_published: false,
              comparison: $matched,
              soak_1800s: $soak,
              standalone_composer_php84_php85: $consumer,
              phpforge_release_guard: $phpforge,
              certification_ready: (
                $precheck == "success" and ($task_open == "0") and
                $matched == "success" and $soak == "success" and
                $consumer == "success" and $phpforge == "success"
              )
            }' > release-certification/decision.json
          cat release-certification/decision.json
          jq -e '.certification_ready == true
            and .release_tag_created == false
            and .package_published == false' \
            release-certification/decision.json >/dev/null || {
              echo "::error::At least one mandatory release certification job failed or was skipped."
              exit 1
            }
          echo "Release evidence gates green; maintainer review still required before publishing."
      - name: Upload frozen candidate release gate decision
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runwire-release-evidence-decision
          path: release-certification/decision.json
          retention-days: 90
