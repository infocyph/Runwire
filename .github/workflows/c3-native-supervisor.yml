name: C3 Native Supervisor Smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: c3-native-supervisor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-supervisor:
    name: C3 native supervisor PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: PHP runtime and native signal extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, posix, sockets
          coverage: none
      - name: Validate all C3 changed PHP source syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/Supervisor/Supervisor.php \
            src/Supervisor/WorkerContext.php \
            src/Supervisor/WorkerGroup.php \
            src/Executor/ProcessExecutor.php \
            src/Network/QuicClientSession.php \
            src/Network/BoundedConnectionPool.php \
            src/Network/IdleConnectionPool.php \
            src/Network/Dialer.php \
            src/Network/HappyEyeballsDialer.php \
            src/Network/TcpListener.php \
            tests/SupervisorLiveAutoscaleTest.php \
            tests/WorkerOwnedTcpDrainTest.php \
            tests/WorkerOwnedNetworkDrainTest.php \
            tests/ProcessExecutorForkOwnershipTest.php \
            tests/TcpListenerForkOwnershipTest.php \
            .ci/c3_listener_fork_smoke.php; do
            php -l "$file"
          done
      - name: Autoscale missing-telemetry hysteresis contract
        run: php .ci/c3_autoscale_window_contract.php
      - name: Portable asynchronous filesystem worker I/O and loop fairness
        run: php .ci/c3_filesystem_smoke.php
      - name: Fork-safe outgoing dials and worker-owned socket drain
        run: php .ci/c3_dialer_smoke.php
      - name: Prefork TCP listener PID ownership and inherited active-loop rejection
        run: php .ci/c3_listener_fork_smoke.php
      - name: Native autoscale real-fork smoke without Composer dependencies
        run: php .ci/c3_supervisor_smoke.php
      - name: Native SIGKILL recovery and bounded crash-loop smoke
        run: php .ci/c3_supervisor_fault_smoke.php
      - name: Mixed HTTP1 TCP UDP native peers across crash recycle reload stop
        run: php .ci/c3_mixed_peer_smoke.php
      - name: Sustained adaptive worker process-tree soak and resource sampling
        run: php .ci/c3_supervisor_soak.php
      - name: Sustained correct HTTP peer traffic during native scale-in and scale-out
        run: php .ci/c3_autoscale_http_traffic.php
